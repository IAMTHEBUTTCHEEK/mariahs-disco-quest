const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const easeOut = t=> 1-Math.pow(1-clamp(t,0,1),3);
const easeIn  = t=> Math.pow(clamp(t,0,1),3);
const easeInOut = t=>{ t=clamp(t,0,1); return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; };
const TAU = Math.PI*2;

let _seed = 1;
function srand(s){ _seed = (s>>>0)||1; }
function rnd(){ _seed = (_seed*1664525 + 1013904223)>>>0; return _seed/4294967296; }
function rndR(a,b){ return a + rnd()*(b-a); }

function hit(ax,ay,ar,bx,by,br){ const dx=ax-bx, dy=ay-by, r=ar+br; return dx*dx+dy*dy < r*r; }

function wrapText(c, text, px, maxW){
  c.font = 'bold '+px+'px "Trebuchet MS", Verdana, sans-serif';
  const words = text.split(' '), lines=[]; let line='';
  for(const w of words){
    const t = line ? line+' '+w : w;
    if(c.measureText(t).width > maxW && line){ lines.push(line); line=w; }
    else line=t;
  }
  if(line) lines.push(line);
  return lines;
}

const Save = (()=>{
  const KEY = "mariahs-disco-quest-v2";
  let ok = true, mem = null;
  try { localStorage.removeItem("mariahs-disco-quest-v1"); } catch(e){}
  function load(){
    if(!ok) return mem;
    try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
    catch(e){ ok=false; return mem; }
  }
  function write(data){
    mem = data;
    if(!ok) return;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ ok=false; }
  }
  function clear(){
    mem = null;
    try { localStorage.removeItem(KEY); } catch(e){}
  }
  return {load, write, clear};
})();

// ============================ S04 INPUT ================================
const Input = (()=>{
  const map = {
    ArrowUp:"up", KeyW:"up", ArrowDown:"down", KeyS:"down",
    ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right",
    Space:"action", Enter:"action"
  };
  const heldKeys = {}, press = {};
  function down(code){
    const a = map[code];
    if(!a) return false;
    if(!heldKeys[a]) press[a] = true;
    heldKeys[a] = true;
    return true;
  }
  function up(code){ const a = map[code]; if(a) heldKeys[a] = false; }
  function held(a){ return !!heldKeys[a]; }
  function pressed(a){ return !!press[a]; }
  function endFrame(){ for(const k in press) press[k] = false; }
  function clearAll(){ for(const k in heldKeys) heldKeys[k]=false; for(const k in press) press[k]=false; }
  return {down, up, held, pressed, endFrame, clearAll};
})();

const Audio = (()=>{

  const mtof = m => 440*Math.pow(2,(m-69)/12);

  function unlock(){
    if(!ctx){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = muted?0:1;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value=-12; comp.ratio.value=4;
        master.connect(comp); comp.connect(ctx.destination);
        musicG = ctx.createGain(); musicG.gain.value = 0.5; musicG.connect(master);
        sfxG   = ctx.createGain(); sfxG.gain.value   = 0.6; sfxG.connect(master);
        const len = ctx.sampleRate;
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
        if(songId) startScheduler();
      }catch(e){ ctx=null; }
    }
    if(ctx && ctx.state === "suspended"){ try{ ctx.resume(); }catch(e){} }
  }

  // ---- voices --------------------------------------------------------
  function vBell(t, m, vel, dur, dest){
    const f = mtof(m);
    const o1=ctx.createOscillator(), o2=ctx.createOscillator();
    const g=ctx.createGain(), g2=ctx.createGain();
    o1.type="sine"; o1.frequency.value=f;
    o2.type="sine"; o2.frequency.value=f*3.01; g2.gain.value = m>=84 ? 0.07 : 0.15;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }
  function vSquare(t, m, vel, dur, dest){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type="square"; o.frequency.value=mtof(m);
    f.type="lowpass"; f.frequency.value=Math.min(2400, mtof(m)*2.5);
    o.connect(f); f.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel*0.55,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  }
  function vTri(t, m, vel, dur, dest){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=mtof(m);
    o.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  }
  function vPluck(t, m, vel, dur, dest){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=mtof(m);
    o.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+Math.min(dur,0.28));
    o.start(t); o.stop(t+0.35);
  }
  function vPad(t, m, vel, dur, dest){
    const g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type="lowpass"; f.frequency.value=900;
    f.connect(g); g.connect(dest);
    for(const det of [-6,6]){
      const o=ctx.createOscillator();
      o.type="sawtooth"; o.frequency.value=mtof(m); o.detune.value=det;
      o.connect(f); o.start(t); o.stop(t+dur+0.4);
    }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vel*0.3,t+dur*0.35);
    g.gain.linearRampToValueAtTime(0.0001,t+dur+0.3);
  }
  function vKick(t, m, vel, dur, dest){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(48,t+0.12);
    o.connect(g); g.connect(dest);
    g.gain.setValueAtTime(vel*1.4,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.start(t); o.stop(t+0.2);
  }
  function vHat(t, m, vel, dur, dest){
    const s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    s.buffer=noiseBuf; s.loop=true;
    f.type="highpass"; f.frequency.value=7000;
    s.connect(f); f.connect(g); g.connect(dest);
    g.gain.setValueAtTime(vel*0.5,t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+Math.min(Math.max(0.035, dur*0.4), 0.18)); // sus opens the hat
    s.start(t); s.stop(t+0.2);
  }
  function vLoon(t, m, vel, dur, dest){
    // a proper common-loon wail: pitch scoop in, hold, gentle fall; vibrato fades IN (instant vibrato = quack)
    const f=mtof(m);
    const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), g2=ctx.createGain();
    const lfo=ctx.createOscillator(), lg=ctx.createGain();
    o.type="sine"; o2.type="sine"; o2.frequency.value=f*2; g2.gain.value=0.22;
    o.frequency.setValueAtTime(f*0.92,t);
    o.frequency.linearRampToValueAtTime(f,t+dur*0.22);
    o.frequency.setValueAtTime(f,t+dur*0.75);
    o.frequency.linearRampToValueAtTime(f*0.97,t+dur);
    lfo.frequency.value=4; lg.gain.setValueAtTime(0,t);
    lg.gain.linearRampToValueAtTime(f*0.035,t+dur*0.45);
    lfo.connect(lg); lg.connect(o.frequency);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vel,t+dur*0.25);
    g.gain.linearRampToValueAtTime(vel*0.85,t+dur*0.7);
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.start(t); o2.start(t); lfo.start(t);
    o.stop(t+dur+0.05); o2.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
  }
  function vSaw(t,m,vel,dur,dest){            // supersaw: stabs and lead
    const g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type="lowpass"; f.Q.value=1.2;
    f.frequency.setValueAtTime(Math.min(5000,mtof(m)*4),t);
    f.frequency.exponentialRampToValueAtTime(Math.max(600,mtof(m)*1.2),t+Math.min(dur,0.3));
    f.connect(g); g.connect(dest);
    for(const det of [-12,0,12]){
      const o=ctx.createOscillator();
      o.type="sawtooth"; o.frequency.value=mtof(m); o.detune.value=det;
      o.connect(f); o.start(t); o.stop(t+dur+0.1);
    }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vel*0.34,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }
  function vClap(t,m,vel,dur,dest){            // 3 noise bursts; bandpass tracks pitch (high m rolls = riser)
    const s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    s.buffer=noiseBuf; s.loop=true;
    f.type="bandpass"; f.frequency.value=mtof(m); f.Q.value=1.1;
    s.connect(f); f.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    for(const [off,v] of [[0,0.7],[0.012,0.85],[0.026,1]]){
      g.gain.setValueAtTime(vel*v,t+off);
      g.gain.exponentialRampToValueAtTime(0.0001,t+off+(off<0.02?0.011:0.10));
    }
    s.start(t); s.stop(t+0.15);
  }
  function vSub(t,m,vel,dur,dest){             // warm house bass: sine + quiet octave triangle
    const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), g2=ctx.createGain();
    o.type="sine"; o.frequency.value=mtof(m);
    o2.type="triangle"; o2.frequency.value=mtof(m)*2.001; g2.gain.value=0.25;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vel*0.55,t+0.025);
    g.gain.setValueAtTime(vel*0.55,t+dur*0.6);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }

  function stepDur(song){ return 60/(song.bpm*song.spb); }

  function scheduleStep(song, idx, t){
    const sd = stepDur(song);
    for(const tr of song.tracks){
      if((tr.layer||0) > layer) continue;
      const n = tr.steps[idx % tr.steps.length];
      if(!n) continue;
      let tt = t;
      if(song.swing && (idx%2)===1) tt += song.swing*sd;
      const notes = Array.isArray(n) ? n : [n];
      const dur = sd*(tr.sus||0.9);
      const dest = (tr.bus==="pump" && pumpG) ? pumpG : musicG;
      if(tr.pumpTrig && pumpG){ // sidechain dip on every kick
        pumpG.gain.setValueAtTime(0.3, tt);
        pumpG.gain.setTargetAtTime(1.0, tt+0.03, 0.09);
      }
      for(const m of notes) VOICES[tr.v](tt, m, tr.vel||0.3, dur, dest);
    }
  }

  function startScheduler(){
    stopScheduler();
    if(!ctx || !songId || pausedA) return;
    nextT = ctx.currentTime + 0.08;
    timer = setInterval(()=>{
      if(!ctx || !songId) return;
      const song = SONGS[songId];
      const sd = stepDur(song);
      while(nextT < ctx.currentTime + 0.13){
        scheduleStep(song, step, nextT);
        nextT += sd; step++;
      }
    }, 25);
    startCont();
  }
  function stopScheduler(){
    if(timer){ clearInterval(timer); timer=null; }
    stopCont();
  }
  function startCont(){
    stopCont();
    if(!ctx) return;
    if(songId === "waltz"){ // soft wind shimmer
      const s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
      const lfo=ctx.createOscillator(), lg=ctx.createGain();
      s.buffer=noiseBuf; s.loop=true;
      f.type="bandpass"; f.frequency.value=700; f.Q.value=0.6;
      lfo.frequency.value=0.13; lg.gain.value=0.012;
      lfo.connect(lg); lg.connect(g.gain);
      g.gain.value=0.022;
      s.connect(f); f.connect(g); g.connect(musicG);
      s.start(); lfo.start();
      contNodes.push(s,lfo);
    }
    if(songId === "peaks"){ // carve whoosh, driven by setWhoosh()
      const s=ctx.createBufferSource(); whooshG=ctx.createGain(); whooshF=ctx.createBiquadFilter();
      s.buffer=noiseBuf; s.loop=true;
      whooshF.type="bandpass"; whooshF.frequency.value=500; whooshF.Q.value=0.8;
      whooshG.gain.value=0;
      s.connect(whooshF); whooshF.connect(whooshG); whooshG.connect(sfxG);
      s.start();
      contNodes.push(s);
    }
    if(SONGS[songId] && SONGS[songId].pump){ // sidechain bus for the EDM track
      pumpG=ctx.createGain(); pumpG.gain.value=1; pumpG.connect(musicG);
    }
  }
  function stopCont(){
    for(const n of contNodes){ try{ n.stop(); }catch(e){} }
    contNodes=[]; whooshG=null; whooshF=null;
    if(pumpG){ try{ pumpG.disconnect(); }catch(e){} pumpG=null; }
  }

  function playSong(id){
    if(id===reqId) return;
    reqId=id;
    const actual = (edmMode && id!=="edm") ? "edm" : id;
    songId=actual; step=0;
    layer = (id==="disco"||id==="edm") ? 0 : 99; // gate by REQUESTED id; substituted edm plays in full
    if(ctx) startScheduler();
  }
  function stopSong(){ songId=null; reqId=null; stopScheduler(); }
  function setEdmMode(on){
    if(on===edmMode) return;
    edmMode=on;
    if(!reqId) return;
    const actual = (on && reqId!=="edm") ? "edm" : reqId;
    if(actual!==songId){
      songId=actual; step=0;
      if(reqId!=="disco" && reqId!=="edm") layer=99;
      if(ctx) startScheduler();
    }
  }
  function edmPhase(){
    if(!ctx||!edmMode||!songId||pausedA) return -1;
    const b=60/126;
    return (ctx.currentTime%b)/b;
  }
  function setLayer(n){ layer = n; }
  function songTime(){ return ctx ? ctx.currentTime : 0; }
  function setWhoosh(i){ // 0..1
    if(!whooshG) return;
    whooshG.gain.value = i*0.16;
    whooshF.frequency.value = 350 + i*900;
  }
  function setMuted(m){
    muted = m;
    if(master) master.gain.setTargetAtTime(m?0:1, ctx.currentTime, 0.03);
  }
  let pausedStart=0, pausedTot=0;
  function musicLvl(){ return pausedA ? 0.06 : (duck ? 0.15 : 0.5); }
  function setPaused(p){
    if(p===pausedA) return;

    if(p){ pausedStart=ctx.currentTime; stopScheduler(); musicG.gain.setTargetAtTime(musicLvl(), ctx.currentTime, 0.05); }
    else { pausedTot+=ctx.currentTime-pausedStart; musicG.gain.setTargetAtTime(musicLvl(), ctx.currentTime, 0.05); startScheduler(); }
  }
  function pausedTotal(){ return pausedTot; }
  function setDuck(d){ // quiet the music so the loon can be HEARD
    duck=d;
    if(ctx) musicG.gain.setTargetAtTime(musicLvl(), ctx.currentTime, 0.15);

  // ---- sfx -----------------------------------------------------------
  function sfxOk(){ return !!ctx && !pausedA; }
  const PENT = [0,2,4,7,9,12,14,16,19,21,24];
  function shard(n){
    if(!sfxOk()) return;
    const t = ctx.currentTime;
    const deg = PENT[Math.round((clamp(n,1,25)-1)/24*10)];
    vBell(t, 72+deg, 0.5, 0.7, sfxG);
    if(n>=25){
      [72,76,79,84,88].forEach((m,i)=> vBell(t+0.07*i, m, 0.45, 1.2, sfxG));
    }
  }
  function bonk(){
    if(!sfxOk()) return;
    const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="square"; o.frequency.setValueAtTime(110,t);
    o.frequency.exponentialRampToValueAtTime(72,t+0.12);
    o.connect(g); g.connect(sfxG);
    g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    o.start(t); o.stop(t+0.18);
    noiseHit(t,400,0.2,0.06);
  }
  function eco(){
    if(!sfxOk()) return;
    const t=ctx.currentTime;
    vBell(t,93,0.35,0.4,sfxG); vBell(t+0.05,100,0.2,0.4,sfxG);
  }
  function yip(pitch=1){
    if(!sfxOk()) return;
    const t=ctx.currentTime;
    for(let i=0;i<2;i++){
      const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
      o.type="sawtooth";
      o.frequency.setValueAtTime(620*pitch,t+i*0.09);
      o.frequency.exponentialRampToValueAtTime(300*pitch,t+i*0.09+0.07);
      f.type="lowpass"; f.frequency.value=2200;
      o.connect(f); f.connect(g); g.connect(sfxG);
      g.gain.setValueAtTime(0.0001,t+i*0.09);
      g.gain.exponentialRampToValueAtTime(0.3,t+i*0.09+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.09+0.08);
      o.start(t+i*0.09); o.stop(t+i*0.09+0.1);
    }
  }
  function noiseHit(t, freq, vel, dur, type="lowpass", sweepTo){
    const s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    s.buffer=noiseBuf; s.loop=true;
    f.type=type; f.frequency.setValueAtTime(freq,t);
    if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);
    s.connect(f); f.connect(g); g.connect(sfxG);
    g.gain.setValueAtTime(vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.start(t); s.stop(t+dur+0.05);
  }
  function puff(){ if(sfxOk()) noiseHit(ctx.currentTime,2000,0.3,0.1,"lowpass",300); }
  function pop(){
    if(!sfxOk()) return;
    const t=ctx.currentTime;
    noiseHit(t,1200,0.45,0.12);
    [76,83,88].forEach((m,i)=> vBell(t+0.04+0.05*i, m+Math.floor(Math.random()*4), 0.25, 0.3, sfxG));
  }
  function chime(){ if(sfxOk()) vBell(ctx.currentTime,88,0.3,0.4,sfxG); }
  function honk(){
    if(!sfxOk()) return;
    const t=ctx.currentTime;
    vLoon(t,64,0.5,0.3,sfxG); vLoon(t+0.18,57,0.45,0.35,sfxG);
  }
  function loonNote(m,d=0.8){ if(sfxOk()) vLoon(ctx.currentTime,m,0.85,d,sfxG); }
  function splash(){ if(sfxOk()) noiseHit(ctx.currentTime,900,0.25,0.18,"lowpass",250); }
  function tick(){ if(sfxOk()) vPluck(ctx.currentTime,98,0.08,0.08,sfxG); }
  function whooshJump(){ if(sfxOk()) noiseHit(ctx.currentTime,500,0.2,0.25,"bandpass",1400); }

  function state(){ return {unlocked:!!ctx, ctxState:ctx?ctx.state:"none", song:songId, muted}; }

  return {unlock, playSong, stopSong, setLayer, songTime, setWhoosh, setMuted, setPaused, pausedTotal, setEdmMode, setDuck, edmPhase, state,
    sfx:{shard,bonk,eco,yip,puff,pop,chime,honk,loonNote,splash,tick,whooshJump}};
})();

// ============================ S06 PARTICLES ============================
const Particles = (()=>{
  const MAX = 600;
  const pool = [];
  for(let i=0;i<MAX;i++) pool.push({on:false});
  let cursor = 0;

  function spawn(o){
    if(Game.rm && Math.random()<0.5) return;
    let p = null;
    for(let i=0;i<MAX;i++){
      cursor = (cursor+1)%MAX;
      if(!pool[cursor].on){ p = pool[cursor]; break; }
    }
    if(!p){ cursor=(cursor+1)%MAX; p = pool[cursor]; }
    p.on=true; p.t=0;
    p.x=o.x||0; p.y=o.y||0;
    p.vx=o.vx||0; p.vy=o.vy||0;
    p.g=o.g!==undefined?o.g:0;
    p.life=o.life||1;
    p.size=o.size||4;
    p.col=o.col||C.white;
    p.shape=o.shape||"dot";
    p.rot=o.rot||0; p.vr=o.vr||0;
    p.drag=o.drag!==undefined?o.drag:1;
    p.tw=o.tw||0; // twinkle
  }
  function burst(x,y,col,n=12,spd=140){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, s=spd*(0.4+Math.random()*0.8);
      spawn({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:120,life:0.5+Math.random()*0.5,
        size:3+Math.random()*4,col,shape:Math.random()<0.5?"star":"dot",drag:0.96,tw:1});
    }
  }
  function confetti(x,y,n=16){
    const cols=[C.pink,C.gold,C.mint,C.lav,C.lake,C.white];
    for(let i=0;i<n;i++){
      spawn({x:x+(Math.random()*60-30),y,vx:Math.random()*160-80,vy:-(120+Math.random()*220),
        g:340,life:1.4+Math.random()*1.2,size:4+Math.random()*4,
        col:cols[(Math.random()*cols.length)|0],shape:"confetti",
        rot:Math.random()*TAU,vr:(Math.random()*8-4),drag:0.99});
    }
  }
  function hearts(x,y,n=8){
    for(let i=0;i<n;i++){
      spawn({x:x+(Math.random()*40-20),y:y+(Math.random()*20-10),
        vx:Math.random()*50-25,vy:-(50+Math.random()*70),g:-18,
        life:1.2+Math.random()*0.7,size:5+Math.random()*6,col:C.pink,shape:"heart",drag:0.99});
    }

  function paw(x,y){
    spawn({x,y,vx:0,vy:160+Math.random()*120,g:0,life:2.2,size:7+Math.random()*5,
      col:Math.random()<0.5?C.bubble:C.lav,shape:"paw",rot:Math.random()*0.8-0.4});
  }
  function update(dt){
    for(const p of pool){
      if(!p.on) continue;
      p.t += dt;
      if(p.t >= p.life){ p.on=false; continue; }
      p.vx*=p.drag; p.vy*=p.drag;
      p.vy += p.g*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.vr*dt;
    }
  }
  function render(c){
    for(const p of pool){
      if(!p.on) continue;
      const k = 1 - p.t/p.life;
      let a = k<0.3 ? k/0.3 : 1;
      if(p.tw) a *= 0.6+0.4*Math.sin(p.t*20+p.size);
      c.globalAlpha = clamp(a,0,1);
      c.fillStyle = p.col;
      const s = p.size;
      if(p.shape==="dot"){
        c.beginPath(); c.arc(p.x,p.y,s/2,0,TAU); c.fill();
      } else if(p.shape==="star"){
        Draw.star(c,p.x,p.y,s,p.col);
      } else if(p.shape==="confetti"){
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        c.fillRect(-s/2,-s/4,s,s/2); c.restore();
      } else if(p.shape==="heart"){
        Draw.heart(c,p.x,p.y,s,p.col);
      } else if(p.shape==="snow"){
        c.beginPath(); c.arc(p.x,p.y,s/2,0,TAU); c.fill();
      } else if(p.shape==="paw"){
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        c.beginPath(); c.ellipse(0,s*0.25,s*0.42,s*0.34,0,0,TAU); c.fill();
        for(let i=-1;i<=1;i++){ c.beginPath(); c.arc(i*s*0.3,-s*0.22,s*0.15,0,TAU); c.fill(); }
        c.restore();
      }
    }
    c.globalAlpha = 1;
  }
  return {spawn,burst,confetti,hearts,paw,update,render};
})();

// ============================ S07 DRAW =================================
const Draw = (()=>{
  function font(c,px,style){ c.font=(style||"bold")+" "+px+'px "Trebuchet MS", Verdana, sans-serif'; }
  function txt(c,s,x,y,px,fill,o={}){
    font(c,px,o.style);
    c.textAlign=o.align||"center"; c.textBaseline=o.base||"middle";
    if(o.out){ c.lineJoin="round"; c.lineWidth=o.ow||Math.max(2,px/6); c.strokeStyle=o.out; c.strokeText(s,x,y); }
    c.fillStyle=fill; c.fillText(s,x,y);
  }
  function rr(c,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }
  function star(c,x,y,s,col){
    c.save(); c.translate(x,y); c.fillStyle=col;
    c.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4, r=(i%2===0)?s:s*0.38;
      c.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath(); c.fill(); c.restore();
  }
  function heart(c,x,y,s,col){
    c.save(); c.translate(x,y); c.scale(s/10,s/10); c.fillStyle=col;
    c.beginPath();
    c.moveTo(0,3.5);
    c.bezierCurveTo(-6,-2.5,-3,-7,0,-3.5);
    c.bezierCurveTo(3,-7,6,-2.5,0,3.5);
    c.fill(); c.restore();
  }
  function shardGem(c,x,y,s,glow=1){
    c.save(); c.translate(x,y);
    if(glow>0){
      const g=c.createRadialGradient(0,0,1,0,0,s*2.4);
      g.addColorStop(0,"rgba(255,214,107,"+(0.35*glow)+")"); g.addColorStop(1,"rgba(255,214,107,0)");
      c.fillStyle=g; c.beginPath(); c.arc(0,0,s*2.4,0,TAU); c.fill();
    }
    c.beginPath();
    c.moveTo(0,-s); c.lineTo(s*0.7,-s*0.2); c.lineTo(s*0.45,s); c.lineTo(-s*0.45,s); c.lineTo(-s*0.7,-s*0.2);
    c.closePath();
    const lg=c.createLinearGradient(-s,-s,s,s);
    lg.addColorStop(0,"#FFFFFF"); lg.addColorStop(0.45,C.gold); lg.addColorStop(1,C.pink);
    c.fillStyle=lg; c.fill();
    c.strokeStyle="rgba(255,255,255,0.9)"; c.lineWidth=1.5; c.stroke();
    c.beginPath(); c.moveTo(0,-s); c.lineTo(0.1*s,s*0.9); c.strokeStyle="rgba(255,255,255,0.6)"; c.stroke();
    c.restore();
  }
  function discoBall(c,x,y,r,fill,spin,o={}){
    if(o.string){
      c.strokeStyle="#8fa0c4"; c.lineWidth=Math.max(1.5,r*0.04);
      c.beginPath(); c.moveTo(x,y-r-o.string); c.lineTo(x,y-r+2); c.stroke();
    }
    const rows = o.rows || (r>60?8 : r>26?6 : 5);
    c.save();
    c.beginPath(); c.arc(x,y,r,0,TAU); c.clip();
    c.fillStyle="#2b3a5e"; c.fillRect(x-r,y-r,2*r,2*r);
    const rh = 2*r/rows;
    const panes=[];
    for(let i=0;i<rows;i++){
      const ry = y+r-(i+1)*rh, cy = ry+rh/2;
      const half = Math.sqrt(Math.max(0.01, r*r-(cy-y)*(cy-y)));
      const cols = Math.max(2, Math.round(half*2/(rh*0.92)));
      const w = 2*half/cols;
      for(let j=0;j<cols;j++) panes.push({x:x-half+j*w, y:ry, w, h:rh, i, j, half});
    }
    const lit = Math.round(clamp(fill,0,1)*panes.length);
    for(let idx=0; idx<panes.length; idx++){
      const p = panes[idx];
      let px = p.x + ((spin*30) % (p.w*2));
      if(px > x+p.half-p.w*0.2) px -= p.half*2;
      let col;
      if(idx < lit){
        const ph = (p.i + p.j + Math.floor(spin*2.5)) % 4;
        col = ph===0?"#FFFFFF" : ph===1?C.gold : ph===2?C.bubble : C.lav;
      } else col = "#3a4a73";
      c.fillStyle=col;
      c.fillRect(px+0.6, p.y+0.6, p.w-1.2, p.h-1.2);
    }
    const g=c.createRadialGradient(x-r*0.35,y-r*0.4,r*0.05,x,y,r);
    g.addColorStop(0,"rgba(255,255,255,0.65)"); g.addColorStop(0.3,"rgba(255,255,255,0.08)");
    g.addColorStop(1,"rgba(20,28,48,0.35)");
    c.fillStyle=g; c.fillRect(x-r,y-r,2*r,2*r);
    c.restore();
    c.strokeStyle="rgba(255,248,252,0.55)"; c.lineWidth=Math.max(1,r*0.035);
    c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke();
  }
  function bubble(c,x,y,text,o={}){

    c.closePath(); c.fillStyle=o.bg||"#FFF8FC"; c.fill();
    c.strokeStyle=o.line||C.ink;
    c.beginPath(); c.moveTo(x-6,by+h); c.lineTo(x+1,by+h+10); c.lineTo(x+8,by+h); c.stroke();
    txt(c,text,bx+w/2,by+h/2+1,o.px||16,o.col||C.ink);
  }
  function vignette(c){
    if(!vigCache){

      vigCache.width=VW; vigCache.height=VH;

// All parametric, drawn around (x,y)=feet/anchor, s = scale (1 = normal)
const Chars = (()=>{
  function ell(c,x,y,rx,ry,col){ c.fillStyle=col; c.beginPath(); c.ellipse(x,y,rx,ry,0,0,TAU); c.fill(); }
  function circ(c,x,y,r,col){ c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); }
  // two-tone kit: a darker blob offset under the main one = soft shading at any scale
  function ell2(c,x,y,rx,ry,col,shade){ ell(c,x+0.9,y+1.2,rx,ry,shade); ell(c,x-0.2,y-0.3,rx,ry,col); }
  const BLOND_D="#E0B44E", BLOND_HI="#FFEFAE", LUNA_D="#D4BF9C", GOLD0="#F2C885";
  const MANE=["#FF4FA3","#F868B2","#EC82C6","#DB95DB","#C9A7F5"];

  function eyes(c,x,y,dx,r,lash){
    circ(c,x-dx,y,r,C.ink); circ(c,x+dx,y,r,C.ink);
    circ(c,x-dx+r*0.3,y-r*0.3,r*0.35,"#fff"); circ(c,x+dx+r*0.3,y-r*0.3,r*0.35,"#fff");
    circ(c,x-dx-r*0.25,y+r*0.35,r*0.18,"#fff"); circ(c,x+dx-r*0.25,y+r*0.35,r*0.18,"#fff");
    if(lash){
      c.strokeStyle=C.ink; c.lineWidth=1; c.lineCap="round";
      for(const sg of [-1,1]){
        c.beginPath();
        c.moveTo(x+sg*(dx+r*0.7), y-r*0.5);
        c.lineTo(x+sg*(dx+r*1.5), y-r*1.05);
        c.stroke();
      }
    }
  }

  // one filled S-curve hair lock (sg = ±1 side); the alternating beziers ARE the wave
  function lockBack(c,sg,hy,sw,col){
    c.fillStyle=col;
    c.beginPath();
    c.moveTo(sg*9, hy-7);
    c.bezierCurveTo(sg*16, hy+2, sg*10, hy+8, sg*14+sw, hy+16);
    c.bezierCurveTo(sg*16.5+sw, hy+20, sg*12+sw, hy+25, sg*10+sw, hy+26);
    c.quadraticCurveTo(sg*8, hy+20, sg*9.5, hy+12);
    c.bezierCurveTo(sg*7.5, hy+6, sg*11.5, hy+1, sg*7, hy-6);
    c.closePath(); c.fill();
  }
  function lockFront(c,sg,hy,sw,col){
    c.fillStyle=col;
    c.beginPath();
    c.moveTo(sg*8, hy-8);
    c.bezierCurveTo(sg*13, hy, sg*8, hy+4, sg*11+sw*0.7, hy+9);
    c.bezierCurveTo(sg*13+sw*0.7, hy+12, sg*10+sw*0.7, hy+14, sg*8.5+sw*0.7, hy+15);
    c.quadraticCurveTo(sg*7, hy+11, sg*8, hy+6);
    c.bezierCurveTo(sg*6.5, hy+2, sg*9.5, hy-2, sg*6, hy-8);
    c.closePath(); c.fill();
  }

  // ---- Mariah: long wavy golden-blonde hair, pink outfit ----------------
  function mariah(c,x,y,s,o={}){
    c.save(); c.translate(x,y); c.scale(o.flip?-s:s,s);
    const b=o.bounce||0;
    c.translate(0,-b*4);
    const M=CONFIG.hairColor, D=BLOND_D, H=BLOND_HI;
    const armSw=o.dance? Math.sin((o.t||0)*7)*6 : 0;
    const sw=o.dance? Math.sin((o.t||0)*7)*1.5 : 0;   // hair tips swing with the dance
    if(o.pose==="sit"){
      c.translate(0,6);
      ell2(c,0,-14,11,13,C.pink,"#E0357F");            // body
      c.fillStyle=C.pink; Draw.rr(c,-3,-10,14,5,2); c.fill(); // leg forward

// ============================ S08 GAME STATE ===========================
const G = {
  progress: 0,
  mapAt: 0,
  shards: null, eco:0, style:0,
  stats: null, keepsakes: null,
  sparkleMode: false,
  reset(){
    this.progress=0; this.mapAt=0;
    this.shards = {L1:new Array(7).fill(false), L2:new Array(6).fill(false),
                   L3:new Array(6).fill(false), L4:new Array(6).fill(false)};
    this.eco=0; this.style=0;
    this.stats={litter:0, boops:0};
    this.keepsakes={echo:false, glowberry:false, match:false, sort:false};
    this.edmUnlocked=false; this.edmOn=false;
  },
  shardCount(){
    let n=0;
    for(const k in this.shards) for(const v of this.shards[k]) if(v) n++;
    return n;
  },
  keepsakeCount(){ let n=0; for(const k in this.keepsakes) if(this.keepsakes[k]) n++; return n; },
  collectShard(level, idx, x, y){
    if(this.shards[level][idx]) return;
    this.shards[level][idx]=true;
    const n=this.shardCount();
    Audio.sfx.shard(n);
    if(x!==undefined){ Particles.burst(x,y,C.gold,14); Particles.burst(x,y,C.white,6,90); }
    Game.hudGlow=1;
    if(n===25) Game.toast("ALL 25 SHARDS!! ✨", C.gold);
  },
  addStyle(n,label,x,y){
    this.style+=Math.round(n);
    if(label) Game.toast(label+"  +"+Math.round(n), C.lav);
  },
  addEco(n,x,y){
    this.eco+=n; this.stats.litter+=n;
    Audio.sfx.eco();
    if(x!==undefined) Particles.burst(x,y,C.mint,8,100);
  },
  save(){
    Save.write({v:2, progress:this.progress, mapAt:this.mapAt, shards:this.shards,
      eco:this.eco, style:this.style, stats:this.stats, keepsakes:this.keepsakes,
      sparkleMode:this.sparkleMode, muted:Game.muted,
      edmUnlocked:this.edmUnlocked, edmOn:this.edmOn});
  },
  load(){
    const d = Save.load();
    if(!d || d.v!==2) return false;
    try{
      this.progress=d.progress|0; this.mapAt=d.mapAt|0;
      if(d.shards && d.shards.L1) this.shards=d.shards;
      this.eco=d.eco|0; this.style=d.style|0;
      if(d.stats) this.stats=d.stats;
      if(d.keepsakes) this.keepsakes=d.keepsakes;
      this.sparkleMode=!!d.sparkleMode;
      if(d.muted){ Game.muted=true; Audio.setMuted(true); }
      this.edmUnlocked=!!d.edmUnlocked;
      if(d.edmOn){ this.edmOn=true; Audio.setEdmMode(true); }
      return this.progress>0;
    }catch(e){ this.reset(); return false; }
  },
  hitScale(){ return this.sparkleMode ? 1.35 : 1; },
  obSpeed(){ return this.sparkleMode ? 0.8 : 1; }
};
G.reset();

// ============================ S09 SCENES ===============================
const Scenes = (()=>{
  const reg = {};
  let cur=null, name="", fade=0, fadeDir=0, pending=null;
  function add(n,obj){ reg[n]=obj; }
  function go(n,params){
    pending={n,params};
    if(!cur){ swap(); fade=1; fadeDir=-1; return; } // boot: fade in, no input-eating fade-up
    fadeDir=1;
  }
  function swap(){
    if(!pending) return;
    if(cur && cur.exit) cur.exit();
    name=pending.n; cur=reg[name]; const p=pending.params; pending=null;
    Input.clearAll();
    if(cur.enter) cur.enter(p);
  }
  function restart(){ if(cur && cur.enter){ Input.clearAll(); cur.enter({restart:true}); } }
  function update(dt){
    if(fadeDir===1){
      fade+=dt*2.6;
      if(fade>=1){ fade=1; swap(); fadeDir=-1; }
    } else if(fadeDir===-1){
      fade-=dt*2.6;
      if(fade<=0){ fade=0; fadeDir=0; }
    }
    if(cur && fadeDir!==1 && cur.update) cur.update(dt);
  }
  function render(c){
    if(cur && cur.render) cur.render(c);
    if(fade>0){
      c.fillStyle="rgba(30,42,68,"+fade.toFixed(3)+")";
      c.fillRect(0,0,VW,VH);
    }
  }
  return {add, go, restart, update, render,
    get name(){ return name; }, get cur(){ return cur; },
    get transitioning(){ return pending!==null || fadeDir===1; }};
})();

  function modeForItem(){
    // returns null when it auto-advanced (mode already set deeper down)
    if(!item) return "done";
    if(item.type==="level"||item.type==="roam"||item.type==="concert") return "card";
    if(item.type==="puzzle"){
      sub = MapStuff.puzzles[item.id];
      if(!sub){ finishSide(); return null; }
      sub.enter(); return "puzzle";
    }
    if(item.type==="vignette"){
      sub = MapStuff.vignettes[item.id];
      if(!sub){ finishSide(); return null; }
      sub.enter(); return "vignette";
    }
    return "idle";
  }
  function targetStop(){
    return (item.type==="puzzle"||item.type==="vignette") ? item.stop : LEVELS[item.id].stop;
  }
  function evalItem(){
    if(G.progress>=JOURNEY.length){ // never run past the finale; never wipe a save here
      G.progress=JOURNEY.length-1; G.save();
    }
    item = JOURNEY[G.progress];
    t=0;
    const ts = targetStop();
    if(G.mapAt !== ts){
      const from=STOPS[G.mapAt], to=STOPS[ts];
      travel={from,to,t:0,ts};
      saidEh = saidUsa = false;
      mode="travel";
    } else {
      const m=modeForItem();
      if(m!==null) mode=m;
    }
  }
  function finishSide(){ // puzzle or vignette done
    G.progress++; G.save();
    sub=null;
    Audio.setDuck(false);    // covers win AND skip paths
    Audio.playSong("title"); // restore map music (no-op if already playing)
    evalItem();
  }

  return {
    showHUD:true, pausable:true,
    enter(){
      if(!bg) buildBg();
      Audio.setDuck(false); // restart/reload safety
      Audio.playSong("title");
      arriveToast=0;
      evalItem();
    },
    skip(){
      if(mode==="puzzle"||mode==="vignette"){ finishSide(); return true; }
      if(mode==="card" && item && item.id!=="FINALE"){
        if(item.id==="GORGE"){ G.edmUnlocked=true; } // skipping the show still gets the aux cord
        G.progress++; G.save(); evalItem(); return true; // 9 on the postcard skips that stop, as advertised
      }
      return false;
    },
    update(dt){
      t+=dt;
      if(mode==="travel"){
        travel.t += dt/2.3;
        const k=easeInOut(travel.t);
        const px=lerp(travel.from.x,travel.to.x,k);
        // crossing the canada border line (~y 168)
        const py=lerp(travel.from.y,travel.to.y,k);
        if(!saidEh && travel.ts===2 && py<175){ saidEh=true; Game.toast("Welcome to B.C., eh! 🍁",C.lav); }
        if(!saidUsa && travel.ts===4 && py>175){ saidUsa=true; Game.toast("Back in the U.S. — snacks acquired.",C.mint); }
        if(!Game.rm) Particles.spawn({x:px,y:py-26,vx:-20,vy:-6,life:0.6,size:3,col:C.gold,shape:"star",tw:1});
        if(travel.t>=1){
          G.mapAt=travel.ts; G.save();
          const m=modeForItem();
          if(m!==null) mode=m;
          t=0;
        }
      } else if(mode==="card"){
        if(Input.pressed("action")) Scenes.go(item.id);
      } else if(mode==="puzzle"||mode==="vignette"){
        if(sub && sub.update(dt)) finishSide();
      }
    },
    render(c){
      c.drawImage(bg,0,0,VW,VH);
      // route already traveled, inked in gold
      c.strokeStyle=C.gold; c.lineWidth=3.5; c.setLineDash([1,11]); c.lineCap="round";
      const inkTo = mode==="travel" ? travel.ts : G.mapAt;
      for(let i=1;i<=inkTo;i++){
        if(!STOPS[i]) break;
        const a=STOPS[i-1], b2=STOPS[i];
        const cxq=(a.x+b2.x)/2+(i%2?28:-28), cyq=(a.y+b2.y)/2;
        c.beginPath(); c.moveTo(a.x,a.y);
        if(mode==="travel" && i===inkTo){
          const k=easeInOut(travel.t);
          for(let s2=1;s2<=12;s2++){
            const u=(s2/12)*k;
            c.lineTo((1-u)*(1-u)*a.x+2*(1-u)*u*cxq+u*u*b2.x,
                     (1-u)*(1-u)*a.y+2*(1-u)*u*cyq+u*u*b2.y);
          }
        } else c.quadraticCurveTo(cxq,cyq,b2.x,b2.y);
        c.stroke();
      }
      c.setLineDash([]);
      // keepsake stickers on visited stops
      for(const id in KEEPSAKES){
        if(G.keepsakes[id]){
          const k=KEEPSAKES[id], s=STOPS[k.stop];
          c.save(); c.translate(s.x+24,s.y+4); c.rotate(0.2);
          c.fillStyle="rgba(255,255,255,0.9)"; c.beginPath(); c.arc(0,0,13,0,TAU); c.fill();
          c.strokeStyle=C.bubble; c.lineWidth=2; c.beginPath(); c.arc(0,0,13,0,TAU); c.stroke();
          Draw.icon(c, id==="echo"?"feather":id==="match"?"ticket":id==="glowberry"?"berry":"badge",0,0,17);
          c.restore();
        }
      }
      // completed-stop checks + next pulsing
      const ts = item? targetStop() : STOPS.length-1;
      for(let i=0;i<STOPS.length;i++){
        const s=STOPS[i];
        if(i===ts && mode!=="puzzle" && mode!=="vignette"){
          const pr= 8+Math.sin(t*4)*3;
          c.strokeStyle=C.pink; c.lineWidth=3;
          c.beginPath(); c.arc(s.x,s.y,pr+6,0,TAU); c.stroke();
          c.fillStyle=C.pink; c.beginPath(); c.arc(s.x,s.y,6,0,TAU); c.fill();
        } else {
          c.fillStyle= i<ts ? C.pink : "#d8b8cd";
          c.beginPath(); c.arc(s.x,s.y,5,0,TAU); c.fill();
          if(i<ts){ Draw.txt(c,"✓",s.x,s.y-1,9,"#fff"); }
        }
      }
      // traveler
      let px,py;
      if(mode==="travel"){
        const k=easeInOut(travel.t);
        px=lerp(travel.from.x,travel.to.x,k); py=lerp(travel.from.y,travel.to.y,k);
        py -= Math.abs(Math.sin(travel.t*Math.PI*6))*8;
      } else { px=STOPS[G.mapAt].x; py=STOPS[G.mapAt].y; }
      Chars.glitter(c,px+4,py-4,0.62,{t,flip:true,trot:mode==="travel",sparkle:mode==="travel"});
      Chars.mariah(c,px-2,py-26,0.5,{pose:"sit", beanie:G.mapAt>=1&&G.mapAt<=3});
      // overlays
      if(mode==="card") drawPostcard(c,item.id,t);
      if((mode==="puzzle"||mode==="vignette") && sub) sub.render(c,t);
      Draw.vignette(c);
    }
  };
})());

// ===================== S12 LEVEL 1 — LITTLE PINE LAKE ==================
function finishLevel(){
  if(Scenes.transitioning) return; // never double-fire during a scene fade
  G.progress++; G.save();
  Scenes.go("MAP");
}
Scenes.add("L1", (()=>{
  const LEN=16500, WTOP=255, WBOT=495, PX=240;
  let t, dist, speed, y, vy, z, vz, airT, bonkT, inv, squash, playerBub;
  let ents, bubbles, fishes, outro, litterTotal, litterGot, fired, snap;
  let bgSky=null;

  let hills=null;
  function buildSky(){
    bgSky=document.createElement("canvas"); bgSky.width=VW; bgSky.height=VH;
    const c=bgSky.getContext("2d");
    const g=c.createLinearGradient(0,0,0,250);
    g.addColorStop(0,"#8FCBEE"); g.addColorStop(0.62,"#CDE9F5"); g.addColorStop(1,"#FFE9B8");
    c.fillStyle=g; c.fillRect(0,0,VW,250);
    // parallax far-hills strip (tiles at 1920)
    hills=document.createElement("canvas"); hills.width=1920; hills.height=70;
    const hc=hills.getContext("2d");
    srand(404);
    for(const [col,base,amp] of [["#bcd7ab",40,16],["#a8c89a",52,13]]){
      hc.fillStyle=col;
      hc.beginPath(); hc.moveTo(0,70);
      for(let hx=0;hx<=1920;hx+=60) hc.lineTo(hx, base - Math.abs(Math.sin(hx*0.011+rnd()*4))*amp);
      hc.lineTo(1920,70); hc.closePath(); hc.fill();
    }
    // sun + glow
    const sg=c.createRadialGradient(745,76,8,745,76,90);
    sg.addColorStop(0,"rgba(255,233,150,0.9)"); sg.addColorStop(1,"rgba(255,233,150,0)");
    c.fillStyle=sg; c.beginPath(); c.arc(745,76,90,0,TAU); c.fill();
    c.fillStyle="#FFEFAF"; c.beginPath(); c.arc(745,76,30,0,TAU); c.fill();
    // puffy clouds
    c.fillStyle="rgba(255,255,255,0.85)";
    for(const [cx,cy,cs] of [[160,70,1],[420,110,0.7],[620,50,0.85]]){
      for(const [ox,oy,r] of [[-28,4,16],[0,-6,22],[26,4,15],[0,8,20]])
        { c.beginPath(); c.arc(cx+ox*cs,cy+oy*cs,r*cs,0,TAU); c.fill(); }
    }
  }

  function gen(){
    srand(2501);
    ents=[];
    // 7 shards (idx 3 is the loon-hat one, spawned as a swimming loon)
    for(let i=0;i<7;i++){
      const d = 1100 + (i+0.4)/7*(LEN-2800) + rndR(-260,260);
      if(i===3){
        ents.push({type:"loonHat", d:0.46*LEN, y:rndR(WTOP+60,WBOT-80), idx:3, taken:false, said:false, dive:0});
      } else {
        ents.push({type:"shard", d, y:rndR(WTOP+30,WBOT-40), idx:i, taken:false});
      }
    }
    // litter
    litterTotal=12; litterGot=0;
    for(let i=0;i<litterTotal;i++){
      ents.push({type:"litter", kind:Math.random()<0.5?"can":"bottle",
        d: 900+(i+0.3)/litterTotal*(LEN-2400)+rndR(-200,200), y:rndR(WTOP+25,WBOT-25), taken:false});
    }
    // obstacles — keep a fair gap from shards
    const obs=["buoy","log","lily","buoy","log","lily"];
    let placed=0, guard=0;
    while(placed<21 && guard<340){
      guard++;
      const d=1400+rnd()*(LEN-3400), yy=rndR(WTOP+25,WBOT-25);
      let ok=true;
      for(const e of ents){
        if((e.type==="shard"||e.type==="loonHat"||e.type==="litter") && Math.abs(e.d-d)<150 && Math.abs(e.y-yy)<90){ ok=false; break; }
        if((e.type==="buoy"||e.type==="log"||e.type==="lily") && Math.abs(e.d-d)<170){ ok=false; break; }
      }
      if(!ok) continue;
      ents.push({type:obs[placed%obs.length], d, y:yy, taken:false, num25:placed===3}); // placed 3 is a buoy — the only type that draws the hidden 25
      placed++;
    }
    // boat wakes
    for(let i=0;i<4;i++) ents.push({type:"wake", d:2600+i*(LEN-4800)/3+rndR(-150,150), taken:false});
    // floating decor loons + one that takes off as you pass
    for(let i=0;i<3;i++) ents.push({type:"loonDecor", d:2000+i*4200+rndR(-300,300), y:rndR(WTOP+20,WBOT-60)});
    ents.push({type:"loonTakeoff", d:LEN*0.62, y:rndR(WTOP+50,WBOT-90), fly:false, ft:0});
  }

  function capture(){ return {shards:G.shards.L1.slice(), eco:G.eco, style:G.style, litter:G.stats.litter}; }
  function restore(s){ G.shards.L1=s.shards.slice(); G.eco=s.eco; G.style=s.style; G.stats.litter=s.litter; }

  function pwx(){ return dist+PX; }
  function cleanedF(){ return litterGot/litterTotal; }

  return {
    showHUD:true, pausable:true,
    sneezeAnchor(){ return {x:PX, y:y-z-30}; },
    enter(params){
      if(params && params.restart && snap) restore(snap); else snap=capture();
      t=0; dist=0; speed=230; y=(WTOP+WBOT)/2; vy=0; z=0; vz=0;
      airT=0; bonkT=0; inv=0; squash=0; playerBub=null;
      bubbles=[]; fishes=[]; outro=null; fired={};
      gen();
      // restore taken flags from shard array (post-restart they're reset anyway)
      for(const e of ents){ if(e.type==="shard"||e.type==="loonHat"){ e.taken=!!G.shards.L1[e.idx]; } }
      if(!bgSky) buildSky();
      Audio.playSong("lake");
    },
    skip(){ finishLevel(); },
    update(dt){
      t+=dt;
      // ---------- outro ----------
      if(outro){
        outro.t+=dt;
        speed=Math.max(0,speed-260*dt);
        dist=Math.min(LEN,dist+speed*dt);
        y=lerp(y,330,2.2*dt);
        if(outro.phase===0 && speed<=4){ outro.phase=1; outro.t=0; Audio.sfx.honk(); }
        else if(outro.phase>=1 && outro.phase<=3 && Input.pressed("action") && outro.t>0.55){
          outro.phase++; outro.t=0;
          if(outro.phase<=3) Audio.sfx.honk();
          if(outro.phase===4) Audio.sfx.chime();
        }
        else if(outro.phase===4 && Input.pressed("action") && outro.t>0.5){
          finishLevel();
        }
        return;
      }
      // ---------- steering ----------
      const air = z>0;
      let dir=0;
      if(Input.held("up")) dir-=1;
      if(Input.held("down")) dir+=1;
      vy += dir*(air?420:980)*dt;
      vy *= (1-4.6*dt);
      y = clamp(y+vy*dt, WTOP, WBOT);
      // boost
      const boosting = Input.held("action") && !air;
      const target = bonkT>0 ? 120 : boosting? 365 : 235;
      speed = lerp(speed, target, (boosting?2.6:1.6)*dt);
      if(boosting){
        G.style += dt*6;
        const cols=[C.pink,C.gold,C.mint,C.lake,C.lav];
        if(!Game.rm) Particles.spawn({x:PX-24,y:y+4,vx:-speed*0.55+rndR(-20,20),vy:rndR(-26,26),
          life:0.5,size:4.5,col:cols[(Math.random()*cols.length)|0],shape:"star",drag:0.94,tw:1});
      }
      // spray
      if(!air && !Game.rm && Math.random()<0.6)
        Particles.spawn({x:PX-18,y:y+10,vx:-speed*0.4,vy:rndR(-50,-10),g:300,life:0.4,size:3,col:"rgba(255,255,255,0.8)",shape:"dot"});
      // sun sparkles on the water
      if(!Game.rm && Math.random()<0.3)
        Particles.spawn({x:Math.random()*VW,y:rndR(WTOP,WBOT),vx:-speed*0.95,vy:0,life:0.8,
          size:2.6,col:"rgba(255,248,220,0.8)",shape:"star",tw:1});
      // air physics
      if(air){
        airT+=dt; vz-=980*dt; z+=vz*dt;
        if(z<=0){
          z=0; vz=0; squash=1;
          Audio.sfx.splash();
          Particles.burst(PX,y+8,"#dff2fb",10,90);
          if(airT>0.45){ G.addStyle(airT*70,"AIR!"); }
          airT=0;
        }
      }
      bonkT=Math.max(0,bonkT-dt); inv=Math.max(0,inv-dt);
      squash=Math.max(0,squash-3.2*dt);
      if(playerBub){ playerBub.t-=dt; if(playerBub.t<=0) playerBub=null; }
      dist += speed*dt;
      // ---------- moments ----------
      if(!fired.go && dist>LEN-1600){ fired.go=true;
        bubbles.push({d:LEN+150,y:298,text:"GO MARIAH!!",t:3,loud:true});
      }
      if(!fired.go2 && dist>LEN-900){ fired.go2=true;
        bubbles.push({d:LEN+150,y:298,text:"WOOOO!!",t:2.5,loud:true});
      }
      // ---------- entities ----------
      const hs=G.hitScale();
      for(const e of ents){
        const sx=e.d-dist+PX;
        if(sx<-150||sx>VW+250) continue;
        if(e.type==="shard" && !e.taken){
          if(hit(PX,y,26*hs,sx,e.y,16) && z<60){
            e.taken=true; G.collectShard("L1",e.idx,sx,e.y);
          }
        } else if(e.type==="loonHat" && !e.taken){
          e.d -= 26*dt; // paddles toward you
          if(!e.said && sx<VW-80){ e.said=true; bubbles.push({d:e.d,y:e.y,text:"found this. it's not a hat?",t:2.6,track:e}); }
          if(hit(PX,y,26*hs,sx,e.y-18,16)){
            e.taken=true; e.dive=1;
            G.collectShard("L1",e.idx,sx,e.y-18);
            bubbles.push({d:e.d,y:e.y,text:"you betcha.",t:1.6,track:e});
            Audio.sfx.honk(); Audio.sfx.splash();
          }
        } else if(e.type==="loonHat" && e.taken && e.dive>0){
          e.dive=Math.max(0,e.dive-dt*1.1); // dives away with dignity
          if(e.dive<0.4 && !e.splashed){ e.splashed=true; Particles.burst(sx,e.y,"#dff2fb",8,80); }
        } else if(e.type==="litter" && !e.taken){
          if(hit(PX,y,24*hs,sx,e.y,14) && z<40){
            e.taken=true; litterGot++;
            G.addEco(1,sx,e.y);
            if(litterGot===litterTotal) Game.toast("lake = sparkling clean!! 🐟",C.mint);
          }
        } else if((e.type==="buoy"||e.type==="log"||e.type==="lily") && !e.taken){
          const r = e.type==="log"?26: e.type==="buoy"?16:20;
          if(inv<=0 && z<30 && hit(PX,y,17,sx,e.y,r*G.obSpeed())){
            inv=1.1; bonkT=1; vy=(y<e.y?-1:1)*140;
            Audio.sfx.bonk(); Game.shake(3,0.18);
            playerBub={text: e.type==="lily"?"oop—":"Ope!",t:1.2};
            Particles.burst(PX+10,y,"#dff2fb",8,80);
          }
        } else if(e.type==="loonTakeoff"){
          if(!e.fly && sx<380){
            e.fly=true;
            Audio.sfx.splash(); Audio.sfx.honk();
            Particles.burst(sx,e.y,"#dff2fb",8,90);
          }
          if(e.fly){ e.ft+=dt; e.y-=62*dt; e.d+=44*dt; }
        } else if(e.type==="wake" && !e.taken){
          const lx = e.d + (y-WTOP)*0.5 - dist + PX; // diagonal line screen x at player's y
          if(Math.abs(PX-lx)<Math.max(10,speed*dt+6) && z===0 && PX>=lx-6){
            e.taken=true;
            vz = 165 + Math.max(0,speed-200)*0.95; z=1;
            Audio.sfx.whooshJump(); Game.shake(2,0.1);
          }
        }
      }
      // fish jump when the water's cleaner
      if(cleanedF()>0.35 && Math.random()<dt*0.55 && fishes.length<3)
        fishes.push({d:dist+rndR(280,720), y0:rndR(WTOP+40,WBOT-40), t:0});
      for(const f of fishes){ f.t+=dt; if(f.t>0.9 && !f.spl){ f.spl=true; Audio.sfx.splash(); } }
      fishes=fishes.filter(f=>f.t<0.95);
      for(const b of bubbles){ b.t-=dt; if(b.track) { b.d=b.track.d; } }
      bubbles=bubbles.filter(b=>b.t>0);
      // ---------- end of lake ----------
      if(dist>=LEN-220 && !outro){ outro={phase:0,t:0}; }
    },
    render(c){
      const cf=cleanedF();
      c.drawImage(bgSky,0,0);
      // distant hills drifting slower than the shore
      const hx=-((dist*0.22)%1920);
      c.drawImage(hills,hx,128); c.drawImage(hills,hx+1920,128);
      // far shoreline band
      c.fillStyle="#cfe7c0"; c.fillRect(0,170,VW,90);
      // pines along shore (world-locked); preserve the gameplay RNG sequence
      const _sv=_seed;
      const startP=Math.floor(dist/140)*140;
      for(let pd=startP; pd<dist+VW+300; pd+=140){
        srand(pd*7+13);
        const sx=pd-dist, ph=rndR(0.8,1.5);
        if(rnd()<0.8 && pd<LEN-300) Draw.icon(c,"pine",sx,222-ph*8,30*ph);
      }
      _seed=_sv;
      // cabin + dock near the end
      const cabX=LEN+90-dist;
      if(cabX<VW+260){
        c.fillStyle="#8a5a3b"; Draw.rr(c,cabX-60,168,120,62,6); c.fill();
        c.fillStyle="#a8412f";
        c.beginPath(); c.moveTo(cabX-74,172); c.lineTo(cabX,128); c.lineTo(cabX+74,172); c.closePath(); c.fill();
        c.fillStyle=C.gold; c.fillRect(cabX-34,186,22,20); c.fillRect(cabX+14,186,22,20);
        c.strokeStyle="#6b4226"; c.lineWidth=3;
        c.strokeRect(cabX-34,186,22,20); c.strokeRect(cabX+14,186,22,20);
        // dock into the water
        c.fillStyle="#b08152";
        Draw.rr(c,cabX-12,230,28,120,4); c.fill();
        c.fillStyle="#9a6e44";
        for(let i=0;i<5;i++) c.fillRect(cabX-12,238+i*22,28,4);
        // Marisa cheering at the dock
        Chars.marisa(c,cabX+38,348,1,{t,wave:true});
      }
      // water
      const wc1=`rgb(${Math.round(lerp(111,154,cf))},${Math.round(lerp(168,215,cf))},${Math.round(lerp(196,242,cf))})`;
      const wg=c.createLinearGradient(0,WTOP-25,0,VH);
      wg.addColorStop(0,wc1); wg.addColorStop(1,"#5d93b8");
      c.fillStyle=wg; c.fillRect(0,WTOP-25,VW,VH-WTOP+25);
      // ripples
      c.strokeStyle="rgba(255,255,255,0.14)"; c.lineWidth=2;
      for(let i=0;i<6;i++){
        const ry=WTOP+10+i*44, off=(t*40+i*60)%80;
        c.beginPath();
        for(let rx=-80+off; rx<VW; rx+=80){ c.moveTo(rx,ry+Math.sin((rx+t*90)/55)*2); c.lineTo(rx+34,ry+Math.sin((rx+34+t*90)/55)*2); }
        c.stroke();
      }
      // reflections of the shoreline pines + reeds at the waterline
      {
        const _s2=_seed;
        const startP2=Math.floor(dist/140)*140;
        for(let pd=startP2; pd<dist+VW+300; pd+=140){
          srand(pd*7+13);
          const sx=pd-dist, ph=rndR(0.8,1.5);
          if(rnd()<0.8 && pd<LEN-300){
            c.fillStyle="rgba(47,107,79,0.13)";
            c.beginPath(); c.ellipse(sx,WTOP-12,9*ph,15*ph,0,0,TAU); c.fill();
          }
        }
        for(let pd=Math.floor(dist/90)*90; pd<dist+VW+200; pd+=90){
          srand(pd*13+7);
          if(rnd()<0.55) continue;
          const sx=pd-dist, n2=2+(rnd()*3|0);
          c.strokeStyle="#5fae6e"; c.lineWidth=2; c.lineCap="round";
          for(let k2=0;k2<n2;k2++){
            const rx=sx+k2*4-4, sway=Math.sin(t*1.2+pd+k2)*2;
            c.beginPath(); c.moveTo(rx,234); c.quadraticCurveTo(rx+1,222,rx+sway,212-rnd()*8); c.stroke();
          }
          if(rnd()<0.6){ c.fillStyle="#7a5230"; Draw.rr(c,sx-1,210,3.4,9,2); c.fill(); }
        }
        _seed=_s2;
      }
      // sun glitter trail — twinkling flecks under the sun
      {
        const _s2=_seed; srand(606);
        for(let i=0;i<14;i++){
          const gy2=WTOP+8+rnd()*(WBOT-WTOP-40);
          const spread=lerp(28,80,(gy2-WTOP)/(WBOT-WTOP));
          const gx=745+(rnd()*2-1)*spread;
          c.globalAlpha=0.25+0.5*Math.abs(Math.sin(t*4+i*1.7));
          c.fillStyle="rgba(255,240,180,0.9)";
          c.fillRect(gx,gy2,6,2);
        }
        _seed=_s2; c.globalAlpha=1;
      }
      // entities (behind player first by y)
      const drawList=[];
      for(const e of ents){
        const sx=e.d-dist+PX;
        if(sx<-120||sx>VW+220) continue;
        drawList.push({e,sx});
      }
      drawList.sort((a,b)=>(a.e.y||0)-(b.e.y||0));
      for(const {e,sx} of drawList){
        const bob=Math.sin(t*2.4+e.d)*3;
        if(e.type==="shard" && !e.taken){
          Draw.shardGem(c,sx,e.y+bob,13,0.8+0.2*Math.sin(t*5+e.d));
        } else if(e.type==="loonHat" && !e.taken){
          Chars.loon(c,sx,e.y+bob*0.5,1,{t:t+e.d,hat:true,flip:true});
        } else if(e.type==="loonHat" && e.taken && e.dive>0){
          c.globalAlpha=e.dive;
          Chars.loon(c,sx,e.y+bob*0.5+(1-e.dive)*28,1,{t:t+e.d,flip:true});
          c.globalAlpha=1;
        } else if(e.type==="litter" && !e.taken){
          Draw.icon(c,e.kind,sx,e.y+bob,20);
        } else if(e.type==="buoy"){
          c.fillStyle="#e2574c";
          c.beginPath(); c.arc(sx,e.y+bob,13,0,TAU); c.fill();
          c.fillStyle="#fff"; Draw.rr(c,sx-13,e.y+bob-4,26,8,4); c.fill();
          if(e.num25) Draw.txt(c,"25",sx,e.y+bob,10,"#e2574c");
          c.fillStyle="rgba(30,42,68,0.18)"; c.beginPath(); c.ellipse(sx,e.y+bob+14,14,4,0,0,TAU); c.fill();
        } else if(e.type==="log"){
          c.save(); c.translate(sx,e.y+bob*0.6);
          c.fillStyle="#7a5230"; Draw.rr(c,-34,-9,68,18,9); c.fill();
          c.fillStyle="#9a6e44"; c.beginPath(); c.ellipse(-34,0,7,9,0,0,TAU); c.fill();
          c.fillStyle="#c8a16e"; c.beginPath(); c.ellipse(-34,0,4,5.5,0,0,TAU); c.fill();
          c.restore();
        } else if(e.type==="lily"){
          c.fillStyle="#5fae6e"; c.beginPath();
          c.ellipse(sx,e.y+bob*0.5,20,11,0,0.25,TAU-0.25); c.lineTo(sx,e.y+bob*0.5); c.fill();
          Draw.heart(c,sx-4,e.y+bob*0.5-7,8,C.bubble);
        } else if(e.type==="wake"){
          c.save(); c.strokeStyle="rgba(255,255,255,0.75)"; c.lineWidth=7; c.lineCap="round";
          c.setLineDash([14,12]);
          c.beginPath(); c.moveTo(sx,WTOP-6); c.lineTo(sx+(WBOT-WTOP)*0.5,WBOT+6); c.stroke();
          c.setLineDash([]); c.restore();
        } else if(e.type==="loonDecor"){
          Chars.loon(c,sx,e.y+bob*0.5,0.8,{t:t+e.d,flip:Math.sin(e.d)>0});
        } else if(e.type==="loonTakeoff"){
          Chars.loon(c,sx,e.y+(e.fly?0:bob*0.5),0.85,{t:t+e.d,flip:true});
          if(e.fly){ // flapping wings
            const fl=Math.sin(e.ft*18)*0.8;
            c.strokeStyle="#1b1f26"; c.lineWidth=3; c.lineCap="round";
            c.beginPath(); c.moveTo(sx-2,e.y-10);
            c.quadraticCurveTo(sx-14,e.y-10-10*fl,sx-22,e.y-6-14*fl); c.stroke();
          }
        }
      }
      // fish jumps
      for(const f of fishes){
        const sx=f.d-dist+PX, k=f.t/0.9;
        const fy=f.y0 - Math.sin(k*Math.PI)*55;
        c.save(); c.translate(sx,fy); c.rotate(lerp(-0.9,0.9,k));
        c.fillStyle="#7fa8c9";
        c.beginPath(); c.ellipse(0,0,11,4.5,0,0,TAU); c.fill();
        c.beginPath(); c.moveTo(-9,0); c.lineTo(-15,-5); c.lineTo(-15,5); c.closePath(); c.fill();
        c.restore();
      }
      // player: jet ski + Mariah
      const py=y-z;
      c.fillStyle="rgba(30,42,68,0.2)";
      c.beginPath(); c.ellipse(PX,y+13,26*(1-z/400),6*(1-z/400),0,0,TAU); c.fill();
      c.save(); c.translate(PX,py);
      const sq=1-squash*0.16;
      c.scale(1/Math.sqrt(sq),sq);
      c.rotate(clamp(vy*0.0011,-0.3,0.3) - (z>0? clamp(vz*0.0009,-0.25,0.25):0));
      if(bonkT>0.4) c.rotate(Math.sin(t*40)*0.05);
      // hull
      c.fillStyle=C.pink; Draw.rr(c,-30,-4,62,16,8); c.fill();
      c.fillStyle="#fff";  Draw.rr(c,-30,-4,62,7,4); c.fill();
      c.fillStyle="#e8418f"; Draw.rr(c,8,-14,16,12,5); c.fill(); // handlebars block
      Chars.mariah(c,-4,-2,0.92,{pose:"sit"});
      c.restore();
      if(playerBub) Draw.bubble(c,PX,py-58,playerBub.text);
      // world bubbles
      for(const b of bubbles){
        const sx=b.d-dist+PX;
        if(sx>-50&&sx<VW+50) Draw.bubble(c,Math.min(sx,VW-90),b.y-40,b.text,{px:b.loud?17:14});
      }
      // outro: the Minnesota goodbye
      if(outro && outro.phase>=1){
        const ph=outro.phase, k=easeOut(Math.min(1,outro.t*1.4));
        let lx;
        if(ph===1) lx=PX+150;
        else if(ph===2) lx=PX+150+(k<0.5? k*2*140 : (1-(k-0.5)*2)*140);
        else if(ph===3) lx=PX+150+(k<0.5? k*2*200 : (1-(k-0.5)*2)*200);
        else lx=PX+150+k*420;
        const ly= ph===4 ? 330-k*260 : 330;
        Chars.loon(c,lx,ly,1.1,{t,flip:false});
        const LINES=[
          "Welp. That's all the lake ones. I s'pose I'll let you go.",
          "Ope — forgot. It gets slippery up north. Mind the ice, you betcha.",
          "Okay, for REAL this time. Bye now. Bye. Byeee.",
        ];
        if(ph<=3 && outro.t>0.55) Draw.bubble(c,lx,ly-42,LINES[ph-1],{px:14});
        if(ph<=3 && outro.t>0.55){
          c.globalAlpha=0.6+0.4*Math.sin(t*5);
          Draw.txt(c,"SPACE",lx,ly+24,15,C.pink,{out:"#fff",ow:4});
          c.globalAlpha=1;
        }
        if(ph===4){
          // tally card
          const a=clamp(outro.t*1.6,0,1);
          c.globalAlpha=a;
          c.fillStyle="rgba(255,253,246,0.96)"; Draw.rr(c,VW/2-240,150,480,200,16); c.fill();
          c.strokeStyle=C.bubble; c.lineWidth=4; Draw.rr(c,VW/2-240,150,480,200,16); c.stroke();
          Draw.txt(c,"LITTLE PINE LAKE ✓",VW/2,192,26,C.pink,{out:"#fff",ow:6});
          const got=G.shards.L1.filter(Boolean).length;
          Draw.txt(c,"shards "+got+"/7 · litter scooped "+litterGot+"/"+litterTotal,VW/2,238,18,C.ink);
          Draw.txt(c,"Marisa rates your wake jumps: ✨✨✨✨✨",VW/2,272,16,"#5f4f68");
          c.globalAlpha=a*(0.6+0.4*Math.sin(t*5));
          Draw.txt(c,"SPACE: westward!",VW/2,318,18,C.pink,{out:"#fff",ow:4});
          c.globalAlpha=1;
        }
      }
      // mini progress
      c.fillStyle="rgba(30,42,68,0.3)"; Draw.rr(c,VW/2-160,VH-20,320,9,5); c.fill();
      c.fillStyle=C.gold; Draw.rr(c,VW/2-158,VH-18,316*clamp(dist/LEN,0,1),5,3); c.fill();
      Draw.vignette(c);
    }
  };
})());

// ===================== S13 LEVEL 2 — NORTHWOODS NIGHT ==================
Scenes.add("L2", (()=>{
  const LEN=13500, PY=205, HORIZON=178, BZ0=5600, BZ1=7100; // BZ = snow-squall band (kept obstacle-free)
  let t, dist, speed, x, vx, heading, z, vz, spin, onIce, slowT, glowT, sparkT, inv;
  let ents, outro, snap, auroraPulse, flipsDone, playerBub, sqIn, sqOut;
  let bg=null;

  function buildBg(){
    bg=document.createElement("canvas"); bg.width=VW; bg.height=VH;
    const c=bg.getContext("2d");
    const g=c.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#0e1730"); g.addColorStop(0.45,C.night); g.addColorStop(1,"#37486f");
    c.fillStyle=g; c.fillRect(0,0,VW,VH);
    // stars
    srand(77);
    c.fillStyle="rgba(255,248,252,0.8)";
    for(let i=0;i<70;i++){ const sx=rnd()*VW, sy=rnd()*150; c.fillRect(sx,sy,rnd()<0.3?2:1.4,1.4); }
    // moon
    c.fillStyle="#FFF8FC"; c.beginPath(); c.arc(848,64,24,0,TAU); c.fill();
    c.fillStyle="#dfe3f2"; c.beginPath(); c.arc(840,58,5,0,TAU); c.fill();
    c.beginPath(); c.arc(856,72,3.4,0,TAU); c.fill();
    // far treeline silhouette
    c.fillStyle="#15203c";
    for(let sx=0;sx<VW;sx+=26){
      srand(sx*3+5);
      const h=22+rnd()*30;
      c.beginPath(); c.moveTo(sx-16,178); c.lineTo(sx,178-h); c.lineTo(sx+16,178); c.closePath(); c.fill();
    }
    // snowfield
    const sg=c.createLinearGradient(0,170,0,VH);
    sg.addColorStop(0,"#c7d4ee"); sg.addColorStop(1,"#eef2fc");
    c.fillStyle=sg; c.fillRect(0,172,VW,VH-172);
  }

  function pineBig(c,px,py,s,snowy){
    c.fillStyle="rgba(30,42,68,0.25)";
    c.beginPath(); c.ellipse(px,py+4,18*s,5*s,0,0,TAU); c.fill();
    c.fillStyle="#27513f";
    for(let i=0;i<3;i++){
      const w=(20-i*5)*s, ty=py-i*14*s;
      c.beginPath(); c.moveTo(px,ty-18*s); c.lineTo(px+w,ty); c.lineTo(px-w,ty); c.closePath(); c.fill();
    }
    if(snowy){ c.fillStyle="rgba(255,248,252,0.9)";
      for(let i=0;i<3;i++){
        const w=(20-i*5)*s*0.6, ty=py-i*14*s-9*s;
        c.beginPath(); c.moveTo(px,ty-8*s); c.lineTo(px+w,ty); c.lineTo(px-w,ty); c.closePath(); c.fill();
      }
    }
    c.fillStyle="#4a3424"; c.fillRect(px-2.4*s,py-2*s,4.8*s,6*s);
  }

  function gen(){
    srand(2502);
    ents=[];
    let gapX=VW/2;
    // tree rows with a wandering safe path (none inside the squall band)
    for(let d=700; d<LEN-900; d+=150){
      gapX = clamp(gapX + rndR(-130,130), 170, VW-170);
      if(d>BZ0-300 && d<BZ1+400){ ents.push({type:"_gap", d, x:gapX}); continue; }
      const n = rnd()<0.5?2:3;
      for(let i=0;i<n;i++){
        let tx = rnd()*VW;
        let guard=0;
        while(Math.abs(tx-gapX)<165 && guard++<10) tx = rnd()*VW;
        if(Math.abs(tx-gapX)<165) continue;
        ents.push({type:"tree", d:d+rndR(-40,40), x:tx, s:rndR(0.8,1.3)});
      }
      ents.push({type:"_gap", d, x:gapX}); // invisible: used to place pickups fairly
    }
    const gaps=ents.filter(e=>e.type==="_gap");
    const gapAt=(d)=>{
      let best=gaps[0];
      for(const g of gaps) if(Math.abs(g.d-d)<Math.abs(best.d-d)) best=g;
      return best?best.x:VW/2;
    };
    // ramps on the path
    const rampDs=[];
    for(let i=0;i<5;i++){
      const d=2200+i*(LEN-4400)/4+rndR(-150,150);
      rampDs.push(d);
      ents.push({type:"ramp", d, x:gapAt(d)+rndR(-30,30)});
    }
    // 6 shards: 3 after ramps (air grabs), 3 on the path
    for(let i=0;i<6;i++){
      let d,xx;
      if(i<3){ d=rampDs[i]+170; xx=gapAt(rampDs[i]); }
      else { d=1400+(i-2.6)/3*(LEN-3200)+rndR(-200,200); xx=gapAt(d)+rndR(-50,50); }
      ents.push({type:"shard", d, x:clamp(xx,80,VW-80), idx:i, taken:false, air:i<3});
    }
    // ice patches
    for(let i=0;i<6;i++){
      const d=1800+i*(LEN-3600)/5+rndR(-180,180);
      ents.push({type:"ice", d, x:clamp(gapAt(d)+rndR(-60,60),150,VW-150), w:rndR(170,240)});
    }
    // cocoa + hotdish
    for(let i=0;i<3;i++){
      const d=2600+i*(LEN-5200)/2+rndR(-300,300);
      ents.push({type:"cocoa", d, x:clamp(gapAt(d)+rndR(-70,70),90,VW-90), taken:false});
    }
    { const d=LEN*0.55; ents.push({type:"hotdish", d, x:clamp(gapAt(d),90,VW-90), taken:false}); }
    // snowmen (one with the hidden 25 scarf)
    for(let i=0;i<3;i++){
      const d=2000+i*(LEN-4500)/2+rndR(-250,250);
      ents.push({type:"snowman", d, x: i%2? 90+rndR(0,60) : VW-130+rndR(0,40), num25:i===1});
    }
    // shy deer at the treeline + warm lantern posts
    for(let i=0;i<2;i++){
      const d=3400+i*5200+rndR(-400,400);
      ents.push({type:"deer", d, x: i%2? 70+rndR(0,40) : VW-100+rndR(0,40), alert:false, flee:0});
    }
    for(let i=0;i<4;i++){
      const d=1500+i*(LEN-3200)/3+rndR(-200,200);
      ents.push({type:"lantern", d, x: i%2? 56 : VW-56});
    }
  }

  function capture(){ return {shards:G.shards.L2.slice(), eco:G.eco, style:G.style, litter:G.stats.litter}; }
  function restore(s){ G.shards.L2=s.shards.slice(); G.eco=s.eco; G.style=s.style; G.stats.litter=s.litter; }

  let trail=[];
  return {
    showHUD:true, pausable:true,
    sneezeAnchor(){ return {x, y:PY-30}; },
    enter(params){
      if(params && params.restart && snap) restore(snap); else snap=capture();
      t=0; dist=0; speed=240; x=VW/2; vx=0; heading=0; z=0; vz=0; spin=0;
      onIce=false; slowT=0; glowT=0; sparkT=0; inv=0; auroraPulse=0; flipsDone=0;
      outro=null; playerBub=null; sqIn=false; sqOut=false; trail=[];
      gen();
      for(const e of ents){ if(e.type==="shard") e.taken=!!G.shards.L2[e.idx]; }
      if(!bg) buildBg();
      Audio.playSong("waltz");
    },
    skip(){ finishLevel(); },
    update(dt){
      t+=dt;
      auroraPulse=Math.max(0,auroraPulse-dt*0.8);
      if(outro){
        outro.t+=dt;
        speed=Math.max(0,speed-300*dt);
        dist+=speed*dt;
        if(Input.pressed("action") && outro.t>0.7) finishLevel();
        return;
      }
      // snow falling
      if(!Game.rm && Math.random()<0.5)
        Particles.spawn({x:Math.random()*VW,y:-10,vx:rndR(-18,6),vy:rndR(50,95),life:6,
          size:2.5+Math.random()*3,col:"rgba(255,248,252,0.85)",shape:"snow"});
      const air = z>0;
      // ice?
      onIce=false;
      for(const e of ents){
        if(e.type!=="ice") continue;
        const sy=e.d-dist+PY;
        if(Math.abs(sy-PY)<46 && Math.abs(x-e.x)<e.w/2) { onIce=true; break; }
      }
      const grip = air?0.4 : onIce?0.16:1;
      let dir=0;
      if(Input.held("left")) dir-=1;
      if(Input.held("right")) dir+=1;
      vx += dir*1050*grip*dt;
      vx *= (1-(onIce?0.55:5.2)*dt*(air?0.4:1));
      x = clamp(x+vx*dt, 46, VW-46);
      heading = lerp(heading, clamp(vx*0.0019,-0.6,0.6), (onIce?2.6:11)*dt);
      // speed
      glowT=Math.max(0,glowT-dt); sparkT=Math.max(0,sparkT-dt);
      slowT=Math.max(0,slowT-dt); inv=Math.max(0,inv-dt);
      // snow squall: cozy crawl, sideways snow, headlight time
      const blizK = clamp((dist-BZ0)/500,0,1)*clamp((BZ1-dist)/500,0,1);
      if(!sqIn && blizK>0.5){ sqIn=true; Game.toast("SNOW SQUALL!! follow your headlight ❄",C.lake); playerBub={text:"uff DA.",t:1.4}; }
      if(sqIn && !sqOut && dist>BZ1){ sqOut=true; Game.toast("...and it's gone. cozy.",C.mint); }
      if(blizK>0.1 && !Game.rm && Math.random()<1.2*blizK)
        Particles.spawn({x:VW+10,y:Math.random()*VH,vx:rndR(-260,-160),vy:rndR(10,50),life:1.4,
          size:2.6+Math.random()*2.6,col:"rgba(255,248,252,0.9)",shape:"snow"});
      const base=((G.sparkleMode?215:245)+(glowT>0?70:0))*(1-0.12*blizK);
      speed=lerp(speed, slowT>0?120:base, 2.2*dt);
      dist+=speed*dt;
      this._blizK=blizK;
      // sled-trail ring buffer (world coords)
      if(z===0 && (!trail.length || dist-trail[trail.length-1].d>30)){
        trail.push({x, d:dist});
        if(trail.length>40) trail.shift();
      }
      // air / flips
      if(air){
        vz-=900*dt; z+=vz*dt;
        if(Input.held("action")) spin+=8.2*dt;
        if(z<=0){
          z=0; vz=0;
          const flips=Math.round(spin/TAU);
          const off=Math.abs(spin-flips*TAU);
          if(flips>0 && off<0.9){
            flipsDone+=flips;
            G.addStyle(45*flips+15,"FLIP x"+flips+"!");
            Audio.sfx.chime();
          } else if(flips>0){
            Particles.burst(x,PY+12,"#fff",12,110);
            playerBub={text:"poof.",t:1};
          }
          if(spin>0.4) Game.shake(2,0.12);
          spin=0;
        }
      }
      if(sparkT>0 && !Game.rm && Math.random()<0.5){
        const cols=[C.pink,C.gold,C.mint,C.lav];
        Particles.spawn({x:x+rndR(-16,16),y:PY+rndR(-20,6),vx:rndR(-30,30),vy:rndR(-60,-20),
          life:0.6,size:4,col:cols[(Math.random()*4)|0],shape:"star",tw:1});
      }
      // snow spray
      if(!air && !Game.rm && Math.random()<0.5)
        Particles.spawn({x:x-heading*26,y:PY+14,vx:rndR(-40,40)-vx*0.2,vy:rndR(20,70),
          life:0.4,size:3,col:"rgba(255,248,252,0.9)",shape:"dot"});
      if(playerBub){ playerBub.t-=dt; if(playerBub.t<=0) playerBub=null; }
      // collisions
      const hs=G.hitScale();
      for(const e of ents){
        const sy=e.d-dist+PY;
        if(sy<-80||sy>VH+120) continue;
        if(e.type==="shard" && !e.taken){
          if(hit(x,PY,26*hs,e.x,sy,17)){
            e.taken=true; G.collectShard("L2",e.idx,e.x,sy);
            auroraPulse=1;
          }
        } else if(e.type==="tree"){
          if(inv<=0 && !air && hit(x,PY,15,e.x,sy,13*e.s)){
            if(sparkT>0){
              G.addStyle(10,null); Particles.burst(e.x,sy,C.gold,10);
              Audio.sfx.chime(); inv=0.4;
            } else {
              inv=1.1; slowT=1;
              Audio.sfx.bonk(); Game.shake(3,0.15);
              playerBub={text:"Uff da!",t:1.3};
              Particles.burst(x,PY-20,"#fff",14,120);
            }
          }
        } else if(e.type==="ramp"){
          if(!air && Math.abs(sy-PY)<Math.max(14,speed*dt+8) && sy<=PY+6 && Math.abs(x-e.x)<52){
            vz=315; z=1; Audio.sfx.whooshJump(); Game.shake(2,0.1);
          }
        } else if(e.type==="cocoa" && !e.taken){
          if(hit(x,PY,24*hs,e.x,sy,15)){
            e.taken=true; glowT=4.5; Audio.sfx.eco();
            Game.toast("cocoa! cozy speed ☕",C.gold);
            Particles.burst(e.x,sy,C.gold,10);
          }
        } else if(e.type==="hotdish" && !e.taken){
          if(hit(x,PY,24*hs,e.x,sy,17)){
            e.taken=true; sparkT=5.5; Audio.sfx.eco(); Audio.sfx.chime();
            Game.toast("TATER TOT HOTDISH!! invincible-ish!",C.pink);
            Particles.burst(e.x,sy,C.pink,16);
          }
        } else if(e.type==="deer"){
          if(!e.alert && Math.abs(sy-PY)<175 && Math.abs(x-e.x)<320) e.alert=true;
          if(e.alert && !e.flee && Math.abs(sy-PY)<105) e.flee=1;
          if(e.flee) e.x += (e.x<VW/2?-1:1)*240*dt;
        }
      }
      if(dist>=LEN && !outro){ outro={t:0}; Audio.sfx.chime(); }
    },
    render(c){
      c.drawImage(bg,0,0);
      // aurora (pink-green ribbons)
      c.save();
      for(let b=0;b<3;b++){
        const baseY=50+b*30, amp=16+b*6;
        const pulse=auroraPulse;
        const rcol = pulse>0.05
          ? `rgba(${Math.round(lerp(140,255,pulse))},${Math.round(lerp(232,110,pulse))},${Math.round(lerp(180,190,pulse))},`
          : "rgba(140,232,180,";
        const grd=c.createLinearGradient(0,baseY-34,0,baseY+50);
        grd.addColorStop(0,rcol+"0)"); grd.addColorStop(0.5,rcol+(0.3+pulse*0.25)+")"); grd.addColorStop(1,rcol+"0)");
        c.fillStyle=grd;
        c.beginPath();
        c.moveTo(-10,baseY+40);
        for(let sx=-10;sx<=VW+10;sx+=40)
          c.lineTo(sx, baseY+Math.sin(sx*0.008+t*0.55+b*1.7)*amp);
        c.lineTo(VW+10,baseY+44); c.closePath(); c.fill();
        c.save(); c.globalAlpha=0.35; c.translate(0,9); c.fill(); c.restore(); // depth pass
      }
      // hanging curtain rays
      c.fillStyle="rgba(140,232,180,0.06)";
      for(let i=0;i<5;i++){
        const cx2=((i*210+t*30)%(VW+200))-100;
        const cy2=50+Math.sin(cx2*0.008+t*0.55)*16;
        c.beginPath(); c.moveTo(cx2-8,cy2); c.lineTo(cx2+8,cy2);

          c.strokeStyle="#6b4a2f"; c.lineWidth=2.6; c.lineCap="round";
          c.save(); c.translate(-10,-22); c.rotate(-0.8+wv);
          c.beginPath(); c.moveTo(0,0); c.lineTo(-12,-10); c.stroke(); c.restore();
          c.beginPath(); c.moveTo(9,-22); c.lineTo(20,-16); c.stroke();
          // scarf
          c.fillStyle=e.num25?C.pink:C.mint;
          Draw.rr(c,-9,-31,18,5,2); c.fill(); Draw.rr(c,2,-29,5,10,2); c.fill();

          c.restore();
        }
      }
      c.globalAlpha=1;
      if(!playerDrawn) drawPlayer();
      // snow squall whiteout — visibility collapses except around the sled
      const blizK=this._blizK||0;
      if(blizK>0.02){
        const wg2=c.createRadialGradient(x,PY+60,70,x,PY+60,520);
        const wa=(Game.rm?0.32:0.5)*blizK;
        wg2.addColorStop(0,"rgba(226,235,250,0)");

        c.fillStyle=hg2;
        c.beginPath(); c.moveTo(x-12,PY+10); c.lineTo(x+12,PY+10);
        c.lineTo(x+heading*150+42,PY+185); c.lineTo(x+heading*150-42,PY+185);
        c.closePath(); c.fill();
        c.globalAlpha=1;
      }

      if(glowT>0){
        c.fillStyle="rgba(255,214,107,"+(0.06*Math.min(1,glowT))+")";

        const got=G.shards.L2.filter(Boolean).length;

// ===================== S14 LEVEL 3 — WHISTLER BLACKCOMB ================
Scenes.add("L3", (()=>{
  const LEN=14500, PY=205, HORIZON=170, GATES=10, FZ0=8000, FZ1=10200; // FZ = freestyle x2 zone
  let t, dist, x, vx, edge, vDown, z, vz, rot, totRot, slowT, inv;
  let ents, outro, snap, gatesHit, gondola, playerBub, banner, fzToast;
  let bg=null, trail=[];

  function buildBg(){
    bg=document.createElement("canvas"); bg.width=VW; bg.height=VH;
    const c=bg.getContext("2d");
    const g=c.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#6BB7E8"); g.addColorStop(0.4,"#9AD7F2"); g.addColorStop(1,"#CDE9F5");
    c.fillStyle=g; c.fillRect(0,0,VW,VH);
    // sun
    const sg=c.createRadialGradient(150,70,8,150,70,80);
    sg.addColorStop(0,"rgba(255,248,220,0.95)"); sg.addColorStop(1,"rgba(255,248,220,0)");
    c.fillStyle=sg; c.beginPath(); c.arc(150,70,80,0,TAU); c.fill();
    c.fillStyle="#FFF6D8"; c.beginPath(); c.arc(150,70,26,0,TAU); c.fill();
    // PNW peak panorama
    function peak(px,h,w,col){
      c.fillStyle=col;
      c.beginPath(); c.moveTo(px-w,HORIZON); c.lineTo(px,HORIZON-h); c.lineTo(px+w,HORIZON); c.closePath(); c.fill();
      c.fillStyle="#FFF8FC";
      c.beginPath(); c.moveTo(px-w*0.4,HORIZON-h*0.58); c.lineTo(px,HORIZON-h);
      c.lineTo(px+w*0.4,HORIZON-h*0.58); c.lineTo(px+w*0.2,HORIZON-h*0.48);
      c.lineTo(px,HORIZON-h*0.6); c.lineTo(px-w*0.2,HORIZON-h*0.46); c.closePath(); c.fill();
    }
    peak(120,95,120,"#8d9fc7"); peak(330,130,150,"#7d8fc0"); peak(560,105,130,"#8d9fc7");
    peak(780,140,160,"#7286ba"); peak(920,90,110,"#98a8cc");
    // bright snow with faint glitter
    const sg2=c.createLinearGradient(0,HORIZON,0,VH);
    sg2.addColorStop(0,"#f4f8ff"); sg2.addColorStop(1,"#dde9fb");
    c.fillStyle=sg2; c.fillRect(0,HORIZON,VW,VH-HORIZON);
    // layered snowbanks with blue shadow under-edges
    for(const [base,fill,shadow] of [[235,"#eef3fd","#c4d2ee"],[335,"#e3ebfa","#bccaea"],[445,"#d8e2f7","#b3c2e6"]]){
      c.fillStyle=fill;
      c.beginPath(); c.moveTo(0,VH);
      for(let bx=0;bx<=VW;bx+=60) c.lineTo(bx, base+Math.sin(bx*0.013+base)*9);
      c.lineTo(VW,VH); c.closePath(); c.fill();
      c.strokeStyle=shadow; c.lineWidth=3;
      c.beginPath();
      for(let bx=0;bx<=VW;bx+=60){
        const by=base+Math.sin(bx*0.013+base)*9;
        bx===0 ? c.moveTo(bx,by) : c.lineTo(bx,by);
      }
      c.stroke();
    }
    srand(31);
    for(let i=0;i<90;i++){
      const sx=rnd()*VW, sy=HORIZON+rnd()*(VH-HORIZON);
      c.fillStyle = rnd()<0.5 ? "rgba(255,255,255,0.9)" : "rgba(200,220,250,0.7)";
      c.fillRect(sx,sy,2,2);
    }
  }

  function gen(){
    srand(2503);
    ents=[];
    let pathX=VW/2;
    const gateDs=[];
    for(let i=0;i<GATES;i++){
      const d=1300+i*(LEN-3300)/(GATES-1);
      pathX=clamp(pathX+rndR(-180,180),200,VW-200);
      gateDs.push({d,x:pathX});
      ents.push({type:"gate", d, x:pathX, idx:i, hit:false, judged:false, num25:i===6});
    }
    const pathAt=(d)=>{
      let prev=gateDs[0], next=gateDs[gateDs.length-1];
      for(const gd of gateDs){ if(gd.d<=d) prev=gd; }
      for(let i=gateDs.length-1;i>=0;i--){ if(gateDs[i].d>=d) next=gateDs[i]; }
      if(next.d===prev.d) return prev.x;
      return lerp(prev.x,next.x,(d-prev.d)/(next.d-prev.d));
    };
    // jumps between gates
    const jumpDs=[];
    for(let i=0;i<4;i++){
      const d=2300+i*(LEN-5000)/3+rndR(-120,120);
      jumpDs.push(d);
      ents.push({type:"ramp", d, x:clamp(pathAt(d)+rndR(-30,30),140,VW-140)});
    }
    // 6 shards: 3 over jumps, 3 between gates
    for(let i=0;i<6;i++){
      let d,xx,air=false;
      if(i<3){ d=jumpDs[i]+150; xx=pathAt(jumpDs[i]); air=true; }
      else { const gi=2+(i-3)*3; d=(gateDs[gi].d+gateDs[gi+1].d)/2; xx=pathAt(d); }
      ents.push({type:"shard", d, x:clamp(xx,90,VW-90), idx:i, taken:false, air});
    }
    // trees + rocks off the racing line
    for(let i=0;i<22;i++){
      const d=1100+rnd()*(LEN-2600);
      let xx=rnd()*VW, guard=0;
      while(Math.abs(xx-pathAt(d))<185 && guard++<12) xx=rnd()*VW;
      if(Math.abs(xx-pathAt(d))<185) continue;
      ents.push({type: rnd()<0.6?"tree":"rock", d, x:xx, s:rndR(0.8,1.3)});
    }
    // powder patches on the line (gentle slow, not punishment)
    for(let i=0;i<4;i++){
      const d=2000+i*(LEN-4200)/3+rndR(-220,220);
      ents.push({type:"powder", d, x:clamp(pathAt(d)+rndR(-40,40),160,VW-160), w:rndR(150,210)});
    }
    // freestyle zone: two bonus ramps + entry/exit arches
    ents.push({type:"ramp", d:FZ0+500, x:clamp(pathAt(FZ0+500)+rndR(-30,30),140,VW-140)});
    ents.push({type:"ramp", d:FZ0+1300, x:clamp(pathAt(FZ0+1300)+rndR(-30,30),140,VW-140)});
    ents.push({type:"arch", d:FZ0, label:"FREESTYLE ZONE · TRICKS ×2"});
    ents.push({type:"arch", d:FZ1, label:"✓ sick."});
    // lift towers along the right margin + lodge & finish at the bottom
    for(let d=900; d<LEN-400; d+=2300) ents.push({type:"lift", d, x:VW-78});
    ents.push({type:"lodge", d:LEN-300, x:150});
    ents.push({type:"finishline", d:LEN-80});
    // unicorn snow sculpture near the finish
    ents.push({type:"sculpture", d:LEN-650, x:VW-150});
    // PISTE/TRAIL sign near the start
    ents.push({type:"sign", d:650, x:130});
  }

  function capture(){ return {shards:G.shards.L3.slice(), eco:G.eco, style:G.style, litter:G.stats.litter}; }
  function restore(s){ G.shards.L3=s.shards.slice(); G.eco=s.eco; G.style=s.style; G.stats.litter=s.litter; }

  return {
    showHUD:true, pausable:true,
    sneezeAnchor(){ return {x, y:PY-30}; },
    enter(params){
      if(params && params.restart && snap) restore(snap); else snap=capture();
      t=0; dist=0; x=VW/2; vx=0; edge=0; vDown=250; z=0; vz=0; rot=0; totRot=0;
      slowT=0; inv=0; gatesHit=0; gondola=null; playerBub=null; banner=0; outro=null; fzToast=false; trail=[];
      gen();
      for(const e of ents){ if(e.type==="shard") e.taken=!!G.shards.L3[e.idx]; }
      if(!bg) buildBg();
      Audio.playSong("peaks");
    },
    exit(){ Audio.setWhoosh(0); },
    skip(){ Audio.setWhoosh(0); finishLevel(); },
    update(dt){
      t+=dt;
      banner=Math.max(0,banner-dt);
      if(outro){
        outro.t+=dt;
        vDown=Math.max(0,vDown-340*dt);
        dist+=vDown*dt;
        Audio.setWhoosh(0);
        if(Input.pressed("action") && outro.t>0.7) finishLevel();
        return;
      }
      const air=z>0;
      let dir=0;
      if(Input.held("left")) dir-=1;
      if(Input.held("right")) dir+=1;
      if(air){
        rot += dir*7.2*dt; totRot += Math.abs(dir*7.2*dt);
        vz-=920*dt; z+=vz*dt;
        if(z<=0){
          z=0; vz=0;
          const half=Math.round(rot/Math.PI), off=Math.abs(rot-half*Math.PI);
          const spins=Math.abs(half)*180;
          const fz = dist>FZ0 && dist<FZ1;
          if(spins>=180 && off<0.62){
            G.addStyle((spins/3+20)*(fz?2:1), spins+"!!"+(fz?" ×2":""));
            Audio.sfx.chime();
          } else if(spins>=180){
            slowT=0.8; Particles.burst(x,PY+10,"#fff",14,120);
            playerBub={text:"powder landing. fluffy.",t:1.2};
          }
          if(Math.abs(rot)>0.4) Game.shake(2,0.12);
          rot=0; totRot=0;
        }
      } else {
        // carve commitment
        edge = lerp(edge, dir, 3.4*dt);
        vx += edge*1300*dt;
        vx *= (1-5.2*dt);
        x = clamp(x+vx*dt, 40, VW-40);
      }
      // powder check
      let inPowder=false;
      for(const e of ents){
        if(e.type!=="powder") continue;
        const sy=e.d-dist+PY;
        if(Math.abs(sy-PY)<42 && Math.abs(x-e.x)<e.w/2){ inPowder=true; break; }
      }
      slowT=Math.max(0,slowT-dt); inv=Math.max(0,inv-dt);
      const carveBonus=Math.abs(edge)*80;
      let target=(G.sparkleMode?225:255)+carveBonus;
      if(inPowder) target*=0.6;
      if(slowT>0) target=130;
      if(Input.held("action") && !air) target+=46; // tuck
      vDown=lerp(vDown,target,2.4*dt);
      dist+=vDown*dt;
      Audio.setWhoosh(air?0.15:clamp(Math.abs(edge)*(vDown/330),0,1));
      // carve-trail ring buffer
      if(z===0 && (!trail.length || dist-trail[trail.length-1].d>26)){
        trail.push({x, d:dist});
        if(trail.length>44) trail.shift();
      }
      // carve spray
      if(!air && Math.abs(edge)>0.45 && !Game.rm && Math.random()<0.7)
        Particles.spawn({x:x-edge*16,y:PY+12,vx:-edge*rndR(60,140),vy:rndR(10,60),
          life:0.45,size:3.4,col:"rgba(255,255,255,0.95)",shape:"dot"});
      if(playerBub){ playerBub.t-=dt; if(playerBub.t<=0) playerBub=null; }
      // freestyle zone entry
      if(!fzToast && dist>FZ0-200){ fzToast=true; Game.toast("FREESTYLE ZONE! tricks worth DOUBLE ✨",C.gold); }
      // gondola moment
      if(!gondola && dist>LEN*0.48){ gondola={t:0,barked:false}; }
      if(gondola && gondola.t<6){
        gondola.t+=dt;
        if(!gondola.barked && gondola.t>1.6){ gondola.barked=true; Audio.sfx.yip(1.1); Audio.sfx.yip(0.8); }
      }
      // entities
      const hs=G.hitScale();
      for(const e of ents){
        const sy=e.d-dist+PY;

      Draw.vignette(c);

  function pineL3(c,px,py,s){
    c.fillStyle="rgba(30,42,68,0.18)";
    c.beginPath(); c.ellipse(px,py+4,18*s,5*s,0,0,TAU); c.fill();

    c.fillStyle="#4a3424"; c.fillRect(px-2.4*s,py-2*s,4.8*s,6*s);
  }
})());
