      const n=6+(rnd()*5|0);
      for(let i=0;i<n;i++){
        c.fillStyle="rgba(255,214,107,"+(0.3+rnd()*0.25).toFixed(2)+")";
        c.fillRect(bx+4+rnd()*(bw-10), by+5+rnd()*(bh-14), 3, 4);
      }
    }
    // space needle
    c.save(); c.translate(280,318); c.scale(2.6,2.6);
    c.strokeStyle="rgba(110,125,160,0.55)"; c.fillStyle="rgba(110,125,160,0.55)"; c.lineWidth=1.8;
    c.beginPath(); c.moveTo(-6,18); c.lineTo(-2,-4); c.moveTo(6,18); c.lineTo(2,-4); c.stroke();
    c.beginPath(); c.ellipse(0,-8,12,5,0,0,TAU); c.fill();
    c.beginPath(); c.moveTo(0,-12); c.lineTo(0,-22); c.stroke();
    c.restore();
  }

  function gen(){
    srand(2504);
    ents=[]; plats=[];
    // platforms: benches + rocks
    const benchXs=[900,1700,2600,3400,4300];
    for(const bx of benchXs) plats.push({x:bx,y:GY-64,w:150,h:12,bench:true});
    // rock platforms low enough to land on (jump apex is ~88px)
    plats.push({x:2050,y:GY-72,w:110,h:12,bench:false});
    plats.push({x:3850,y:GY-72,w:110,h:12,bench:false});
    // 3 dig spots (shards 0..2)
    const digXs=[1250,2900,4600];
    digXs.forEach((dx,i)=> ents.push({type:"dig", x:dx, idx:i, done:false, glow:0}));
    // shards 3+4 float above the rock platforms — hop up (or a big jump from the ground)
    ents.push({type:"shard", x:2105, y:GY-116, idx:3, taken:false});
    ents.push({type:"shard", x:3905, y:GY-116, idx:4, taken:false});
    // litter + bins
    const litXs=[700,1450,2300,3100,3700,4900];
    const kinds=["can","bottle","can","paper","bottle","ball"];
    litXs.forEach((lx2,i)=> ents.push({type:"litter", x:lx2, kind:kinds[i], taken:false}));
    for(const bx of [1100,2750,4150]) ents.push({type:"bin", x:bx});
    // trees (cherry) + squirrel tree
    for(let i=0;i<9;i++) ents.push({type:"tree", x:420+i*600+rndR(-90,90), s:rndR(0.9,1.3)});
    ents.push({type:"squirrelTree", x:3250});
    // joggers
    joggers=[{x:1500,dir:1,min:1400,max:1900,frisT:2,bib:false},{x:3600,dir:-1,min:3450,max:3950,frisT:4,bib:true}];
    // park furniture: lampposts + flowerbeds
    for(const lx2 of [600,1850,3050,4450,5400]) ents.push({type:"lamp", x:lx2});
    for(const fx2 of [950,2450,3550,4750]) ents.push({type:"flowerbed", x:fx2});
    // ducks paddling the lake (world coords, slow)
    ducks=[{x:700,tip:0},{x:2400,tip:0},{x:4200,tip:0}];
  }
  let ducks=[], pawTrail=[];

  function capture(){ return {shards:G.shards.L4.slice(), eco:G.eco, style:G.style, litter:G.stats.litter, boops:G.stats.boops}; }
  function restore(s){ G.shards.L4=s.shards.slice(); G.eco=s.eco; G.style=s.style; G.stats.litter=s.litter; G.stats.boops=s.boops; }

  function popShard(idx,x,y){
    // a shard leaps out of the ground and is gathered with sparkle
    G.collectShard("L4",idx,x,y);
  }

  return {
    showHUD:true, pausable:true,
    sneezeAnchor(){ return {x:lx-camX, y:ly-30}; },
    enter(params){
      if(params && params.restart && snap) restore(snap); else snap=capture();
      t=0; lx=160; ly=GY; lvx=0; lvy=0; grounded=true; coyote=0; jbuf=0; facing=1;
      camX=0; carry=null; digT=0; squash=0; green=0; outro=null; banner=0;
      playerBub=null; squirrelDone=false; frisbees=[]; pawTrail=[];
      shasta={state:"wait", x:WX+150, y:GY, t:0};
      gen();
      for(const e of ents){
        if(e.type==="shard") e.taken=!!G.shards.L4[e.idx];
        if(e.type==="dig") e.done=!!G.shards.L4[e.idx];
      }
      green = G.shards.L4.some(Boolean)?0.2:0;
      if(!skyline) buildSkyline();
      Audio.playSong("park");
    },
    skip(){ finishLevel(); },
    update(dt){
      t+=dt;
      banner=Math.max(0,banner-dt);
      if(outro){
        outro.t+=dt;
        if(Input.pressed("action") && outro.t>0.7) finishLevel();
        return;
      }
      // ---------------- Luna movement ----------------
      let dir=0;
      if(Input.held("left")) dir-=1;
      if(Input.held("right")) dir+=1;
      if(dir!==0) facing=dir;
      const targetV = dir*300;
      const rate = dir!==0 ? (grounded?1600:1000) : (grounded?1200:300);
      lvx += clamp(targetV-lvx, -rate*dt, rate*dt);
      lx = clamp(lx+lvx*dt, 40, WX-40);
      // jump buffering + coyote time
      jbuf=Math.max(0,jbuf-dt); coyote=Math.max(0,coyote-dt);
      if(Input.pressed("action")) jbuf=0.12;
      if(jbuf>0 && (grounded||coyote>0)){
        jbuf=0; coyote=0; grounded=false;
        lvy=-640; squash=-1;
        Audio.sfx.tick();
      }
      const wasGrounded=grounded;
      lvy += 2200*dt;
      ly += lvy*dt;
      grounded=false;
      if(ly>=GY){ ly=GY; lvy=0; grounded=true; }
      else if(lvy>0){
        for(const p of plats){
          if(lx>p.x-10 && lx<p.x+p.w+10 && ly>=p.y && ly-lvy*dt<=p.y+14){ ly=p.y; lvy=0; grounded=true; break; }
        }
      }
      if(!grounded && wasGrounded && lvy>=0) coyote=0.1;
      if(grounded && !wasGrounded){ squash=1; if(lvy===0) Particles.burst(lx-camX,ly,"#cfe0d8",5,60); }
      squash*=(1-7*dt);
      camX = clamp(lx-330, 0, WX-VW);
      // paw prints behind her (world coords, alternating left/right pads)
      if(grounded && ly===GY && Math.abs(lvx)>60 &&
         (!pawTrail.length || Math.abs(lx-pawTrail[pawTrail.length-1].x)>26)){
        pawTrail.push({x:lx, side:(pawTrail.length%2)*8-4});
        if(pawTrail.length>14) pawTrail.shift();
      }
      // ducks paddle, occasionally tip tail-up
      for(const dk of ducks){
        dk.x+=12*dt; if(dk.x>WX) dk.x=-30;
        if(dk.tip>0) dk.tip-=dt;
        else if(Math.random()<dt/9) dk.tip=1;
      }
      // cherry blossom petals drift as the park blooms
      if(!Game.rm && Math.random()<green*0.3)
        Particles.spawn({x:Math.random()*VW,y:-8,vx:rndR(-25,5),vy:35,life:3,size:3,
          col:Math.random()<0.5?C.bubble:C.blush,shape:"confetti",rot:Math.random()*TAU,vr:3,drag:0.995});
      // ---------------- digging ----------------
      let onDig=null;
      for(const e of ents){
        if(e.type==="dig" && !e.done && Math.abs(lx-e.x)<42 && grounded) onDig=e;
        if(e.type==="dig") e.glow=Math.max(0, e.glow - dt) ;
      }
      if(onDig && Input.held("down")){
        digT+=dt;
        onDig.glow=1;
        if(!Game.rm && Math.random()<0.8)
          Particles.spawn({x:onDig.x-camX+rndR(-14,14),y:GY+2,vx:rndR(-70,70),vy:rndR(-180,-60),g:500,
            life:0.5,size:3.6,col:"#8a6a4a",shape:"dot"});
        if(digT>=0.8){
          digT=0; onDig.done=true;
          popShard(onDig.idx,onDig.x-camX,GY-40);
          Audio.sfx.yip(1.15);
        }
      } else digT=Math.max(0,digT-dt*2);
      // ---------------- joggers + frisbees ----------------
      for(const j of joggers){
        j.x += j.dir*70*dt;
        if(j.x<j.min||j.x>j.max) j.dir*=-1;
        j.frisT-=dt;
        if(j.frisT<=0 && Math.abs(j.x-lx)<420 && frisbees.length<2){
          j.frisT=6+Math.random()*3;
          const toward = lx>j.x?1:-1;
          frisbees.push({x:j.x, y:GY-58, vx:toward*rndR(160,230), vy:rndR(-260,-180), t:0, caught:false});
          Audio.sfx.tick();
        }
      }
      for(const f of frisbees){
        f.t+=dt;
        if(f.caught) continue;
        f.vy+=760*dt; f.x+=f.vx*dt; f.y+=f.vy*dt;
        if(f.y>=GY-8){ f.y=GY-8; f.vx*=0.5; f.vy=0; }
        if(!grounded && hit(lx,ly-22,26*G.hitScale(),f.x,f.y,12)){
          f.caught=true; f.t=10;
          G.addStyle(35,"CAUGHT IT!");
          Audio.sfx.yip(1.2);
          Particles.burst(f.x-camX,f.y,C.pink,10);
        }
      }
      frisbees=frisbees.filter(f=>f.t<12 && (f.caught? f.t<10.6 : true));
      // ---------------- litter + bins ----------------
      const hs=G.hitScale();
      for(const e of ents){
        if(e.type==="litter" && !e.taken && !carry){
          if(hit(lx,ly-14,24*hs,e.x,GY-10,14)){
            e.taken=true; carry=e.kind;
            Audio.sfx.tick();
            playerBub={text:"got it. to the bin!",t:1.2};
          }
        } else if(e.type==="bin" && carry){
          if(Math.abs(lx-e.x)<34){
            carry=null;
            G.addEco(1,e.x-camX,GY-50);
            green=clamp(green+1/6,0,1);
            if(green>=0.99) Game.toast("the park is GLOWING. good girl.",C.mint);
          }
        } else if(e.type==="shard" && !e.taken){
          if(hit(lx,ly-18,26*hs,e.x,e.y,17)){
            e.taken=true; G.collectShard("L4",e.idx,e.x-camX,e.y);
          }
        } else if(e.type==="squirrelTree" && !squirrelDone){
          if(Math.abs(lx-e.x)<110){
            squirrelDone=true; e.squirrelT=0;
            G.addStyle(25,"squirrel consulted!");
            Audio.sfx.yip(1.3);
          }
        }
        if(e.type==="squirrelTree" && e.squirrelT!==undefined && e.squirrelT<1.4) e.squirrelT+=dt;
      }
      // ---------------- rain (clears as the park greens) ----------------
      const rainRate=(1-green)*0.8;
      if(!Game.rm && Math.random()<rainRate)
        Particles.spawn({x:Math.random()*VW,y:-8,vx:-30,vy:520,life:1.1,size:2.2,
          col:"rgba(154,196,220,0.6)",shape:"dot"});
      if(playerBub){ playerBub.t-=dt; if(playerBub.t<=0) playerBub=null; }
      // ---------------- Shasta's big moment ----------------
      const sh=shasta;
      sh.t+=dt;
      if(sh.state==="wait" && lx>WX-760){ sh.state="trot"; sh.t=0; Audio.sfx.yip(0.8); }
      else if(sh.state==="trot"){
        sh.x-=190*dt;
        if(sh.x<=WX-450){ sh.x=WX-450; sh.state="dig"; sh.t=0; }
      } else if(sh.state==="dig"){
        if(!Game.rm && Math.random()<0.85)
          Particles.spawn({x:sh.x-20-camX+rndR(-12,12),y:GY+2,vx:rndR(-90,-20),vy:rndR(-190,-70),g:520,
            life:0.5,size:3.6,col:"#8a6a4a",shape:"dot"});
        if(sh.t>1.3){
          sh.state="found"; sh.t=0;
          popShard(5,sh.x-20-camX,GY-46);
          Audio.sfx.yip(0.8);
        }
      } else if(sh.state==="found"){
        if(sh.t>0.8){ sh.state="walk"; sh.t=0; }
      } else if(sh.state==="walk"){
        const tx=lx+34;
        sh.x += clamp(tx-sh.x,-1,1)*150*dt;
        if(Math.abs(sh.x-(lx+34))<10 && grounded){
          sh.state="boop"; sh.t=0;
          G.stats.boops=2;
          Particles.hearts((sh.x+lx)/2-camX,GY-44,14);
          Audio.sfx.chime(); Audio.sfx.yip(0.8); Audio.sfx.yip(1.2);
          banner=2.8;
        }
      } else if(sh.state==="boop"){
        if(sh.t>3){ outro={t:0}; banner=0; Audio.sfx.chime(); }
      }
    },
    render(c){
      // sky lerps from drizzle to sunshine
      const sky1=`rgb(${Math.round(lerp(142,107,green))},${Math.round(lerp(155,183,green))},${Math.round(lerp(176,232,green))})`;
      const sky2=`rgb(${Math.round(lerp(190,205,green))},${Math.round(lerp(198,233,green))},${Math.round(lerp(212,245,green))})`;
      const g=c.createLinearGradient(0,0,0,VH);
      g.addColorStop(0,sky1); g.addColorStop(1,sky2);
      c.fillStyle=g; c.fillRect(0,0,VW,VH);
      // sun comes out
      if(green>0.4){
        const a=(green-0.4)/0.6;
        c.globalAlpha=a;
        const sg=c.createRadialGradient(800,90,10,800,90,90);
        sg.addColorStop(0,"rgba(255,233,150,0.95)"); sg.addColorStop(1,"rgba(255,233,150,0)");
        c.fillStyle=sg; c.beginPath(); c.arc(800,90,90,0,TAU); c.fill();
        c.fillStyle="#FFF0B8"; c.beginPath(); c.arc(800,90,28,0,TAU); c.fill();
        c.globalAlpha=1;
      }
      c.drawImage(skyline,-camX*0.06,0);
      // the lake (green lake!)
      const lakeCol=`rgba(${Math.round(lerp(130,124,green))},${Math.round(lerp(170,205,green))},${Math.round(lerp(190,226,green))},0.9)`;
      c.fillStyle=lakeCol; c.fillRect(0,392,VW,28);
      // city-light reflections smearing on the water (parallax-locked to the skyline)
      c.fillStyle="rgba(255,233,150,0.12)";
      for(const rx of [70,140,440,720,880,1040]){
        c.fillRect(rx-camX*0.06,393,4,26);
      }
      c.fillStyle="rgba(255,255,255,0.25)";
      for(let i=0;i<5;i++) c.fillRect(((t*22+i*210)%(VW+80))-40,398+(i%3)*7,34,2);
      // ducks
      for(const dk of ducks){
        const dx2=dk.x-camX*0.5; // mid-distance parallax
        if(dx2<-40||dx2>VW+40) continue;
        const bob2=Math.sin(t*2+dk.x)*1.5;
        c.save(); c.translate(dx2,404+bob2);
        c.strokeStyle="rgba(255,255,255,0.3)"; c.lineWidth=1.5;
        c.beginPath(); c.moveTo(-6,3); c.lineTo(-16,6); c.moveTo(-6,3); c.lineTo(-14,1); c.stroke();
        if(dk.tip>0){ // bottoms up
          c.fillStyle="#7a6a50"; c.beginPath(); c.ellipse(0,0,7,5,0,0,TAU); c.fill();
          c.fillStyle="#fff"; c.beginPath(); c.moveTo(2,-4); c.lineTo(6,-10); c.lineTo(8,-3); c.closePath(); c.fill();
        } else {
          c.fillStyle="#7a6a50"; c.beginPath(); c.ellipse(0,0,7,4.6,0,0,TAU); c.fill();
          c.fillStyle="#3f6b4f"; c.beginPath(); c.arc(6,-4,3.2,0,TAU); c.fill();
          c.fillStyle=C.gold;
          c.beginPath(); c.moveTo(9,-4); c.lineTo(13,-3); c.lineTo(9,-2); c.closePath(); c.fill();
        }
        c.restore();
      }
      // ground strip
      const grass=`rgb(${Math.round(lerp(150,128,green))},${Math.round(lerp(178,224,green))},${Math.round(lerp(152,170,green))})`;
      c.fillStyle=grass; c.fillRect(0,420,VW,VH-420);
      c.fillStyle="#c9b8a4"; c.fillRect(0,GY+6,VW,16); // the loop path
      c.fillStyle="rgba(30,42,68,0.08)"; c.fillRect(0,GY+20,VW,3);
      c.save(); c.translate(-camX,0);
      // paw prints on the path
      c.fillStyle="rgba(138,106,74,0.25)";
      for(let i2=0;i2<pawTrail.length;i2++){
        const pw=pawTrail[i2];
        if(pw.x<camX-20||pw.x>camX+VW+20) continue;
        c.beginPath(); c.ellipse(pw.x,GY+11+pw.side*0.4,2.6,2,0,0,TAU); c.fill();
        for(let k2=-1;k2<=1;k2++){ c.beginPath(); c.arc(pw.x+k2*1.8,GY+8.6+pw.side*0.4,0.9,0,TAU); c.fill(); }
      }
      // world entities
      for(const e of ents){
        const sx=e.x;
        if(sx<camX-140||sx>camX+VW+140) continue;
        if(e.type==="tree"||e.type==="squirrelTree"){
          const s=e.s||1.1;
          c.fillStyle="#7a5a40"; Draw.rr(c,sx-5*s,GY-66*s,10*s,66*s,4); c.fill();
          const bloom=green;
          for(const [ox,oy,r] of [[-22,-72,20],[0,-88,24],[22,-70,19],[0,-64,22]]){
            c.fillStyle=`rgb(${Math.round(lerp(120,255,bloom))},${Math.round(lerp(160,182,bloom))},${Math.round(lerp(120,217,bloom))})`;
            c.beginPath(); c.arc(sx+ox*s,GY+oy*s,r*s,0,TAU); c.fill();
          }
          if(e.type==="squirrelTree"){
            const sq=e.squirrelT===undefined?0:Math.min(1,e.squirrelT/1.2);
            const sy=GY-20-sq*70;
            c.save(); c.translate(sx+14,sy);
            c.fillStyle="#9a6a44";
            c.beginPath(); c.ellipse(0,0,7,5,0,0,TAU); c.fill();
            c.beginPath(); c.arc(6,-3,3.4,0,TAU); c.fill();
            c.strokeStyle="#9a6a44"; c.lineWidth=4; c.lineCap="round";
            c.beginPath(); c.moveTo(-6,0); c.quadraticCurveTo(-13,-4,-11,-12); c.stroke();
            c.restore();
          }
        } else if(e.type==="dig" && !e.done){
          const glow=0.5+0.5*Math.sin(t*4+e.x);
          const rg=c.createRadialGradient(sx,GY+4,2,sx,GY+4,34);
          rg.addColorStop(0,`rgba(255,214,107,${0.4*glow+0.2})`); rg.addColorStop(1,"rgba(255,214,107,0)");
          c.fillStyle=rg; c.beginPath(); c.arc(sx,GY+4,34,0,TAU); c.fill();
          c.fillStyle="#8a6a4a"; c.beginPath(); c.ellipse(sx,GY+4,22,8,0,0,TAU); c.fill();
          c.fillStyle="#a5805c"; c.beginPath(); c.ellipse(sx,GY+2,16,5,0,0,TAU); c.fill();
          Draw.star(c,sx,GY-12,5,C.gold);
          // dig progress ring
          if(Math.abs(lx-e.x)<42 && digT>0){
            c.strokeStyle=C.gold; c.lineWidth=5; c.lineCap="round";
            c.beginPath(); c.arc(sx,GY-34,16,-Math.PI/2,-Math.PI/2+digT/0.8*TAU); c.stroke();
            Draw.txt(c,"dig!",sx,GY-58,14,C.ink,{out:"#fff",ow:4});
          } else if(Math.abs(lx-e.x)<60){
            Draw.txt(c,"hold ↓",sx,GY-44,14,C.ink,{out:"#fff",ow:4});
          }
        } else if(e.type==="litter" && !e.taken){
          Draw.icon(c,e.kind,sx,GY-10,20);
        } else if(e.type==="bin"){
          c.fillStyle="#3f7fb8"; Draw.rr(c,sx-18,GY-44,36,44,5); c.fill();
          c.fillStyle="#356c9d"; Draw.rr(c,sx-21,GY-48,42,9,4); c.fill();
          Draw.icon(c,"recycle",sx,GY-23,20);
          if(carry && Math.abs(lx-sx)<140){
            c.globalAlpha=0.6+0.4*Math.sin(t*6);
            Draw.txt(c,"here!",sx,GY-62,14,"#fff",{out:"#3f7fb8",ow:4});
            c.globalAlpha=1;
          }
        } else if(e.type==="shard" && !e.taken){
          const bob=Math.sin(t*3+e.x)*4;
          Draw.shardGem(c,sx,e.y+bob,13,0.9);
        } else if(e.type==="lamp"){
          c.fillStyle="#46557a"; c.fillRect(sx-3,GY-84,6,84);
          c.fillRect(sx-12,GY-84,24,4);
          c.fillStyle="rgba(255,233,150,0.9)";
          c.beginPath(); c.arc(sx,GY-90,7,0,TAU); c.fill();
          c.fillStyle="#46557a";
          c.beginPath(); c.arc(sx,GY-99,3,0,Math.PI,true); c.fill();
        } else if(e.type==="flowerbed"){
          c.fillStyle="#a5805c"; Draw.rr(c,sx-34,GY-2,68,10,5); c.fill();
          for(let k2=0;k2<5;k2++){
            const fx3=sx-26+k2*13;
            c.strokeStyle="#5fae6e"; c.lineWidth=1.6;
            c.beginPath(); c.moveTo(fx3,GY-2); c.lineTo(fx3,GY-12); c.stroke();
            const bloom=`rgb(${Math.round(lerp(150,255,green))},${Math.round(lerp(170,140+k2*8,green))},${Math.round(lerp(150,190,green))})`;
            Draw.star(c,fx3,GY-15,3.6,green>0.3?[C.pink,C.gold,C.bubble,C.lav,"#fff"][k2]:bloom);
          }
        }
      }
      // platforms (benches)
      for(const p of plats){
        if(p.x+p.w<camX-40||p.x>camX+VW+40) continue;
        if(p.bench){
          c.fillStyle="#8a6a4a";
          Draw.rr(c,p.x,p.y,p.w,9,4); c.fill();
          c.fillRect(p.x+14,p.y+9,10,GY-p.y-9);
          c.fillRect(p.x+p.w-24,p.y+9,10,GY-p.y-9);
          c.fillStyle="#a5805c"; Draw.rr(c,p.x,p.y-22,p.w,8,4); c.fill();
        } else {
          c.fillStyle="#9aa6c0"; Draw.rr(c,p.x,p.y,p.w,14,7); c.fill();
          c.fillStyle="#b8c2d8"; Draw.rr(c,p.x+8,p.y+2,p.w-16,5,3); c.fill();
        }

// ---- The Loon's Echo (Simon-says at the dock) --------------------------
MapStuff.puzzles.echo = (()=>{
  const NOTES=[57,64,69,76], COLS=[C.pink,C.mint,C.gold,C.lav]; // low→high matches left→right
  const KEYS=["left","down","up","right"], GLYPH=["←","↓","↑","→"];
  let round, seq, phase, idx, misses, assist, timer, lit, t, doneT, loonSay;
  function startRound(){
    seq=[]; const len=round+2;
    for(let i=0;i<len;i++) seq.push((Math.random()*4)|0);
    phase="listen"; idx=0; timer=1.1; lit=-1;
  }
  return {
    enter(){
      round=0; misses=0; assist=false; t=0; doneT=0;
      loonSay={text:"listen close, then sing it back.",t:3};
      Audio.setDuck(true); // the loon deserves a quiet stage
      startRound();
    },
    update(dt){
      t+=dt;
      if(loonSay){ loonSay.t-=dt; if(loonSay.t<=0) loonSay=null; }
      if(doneT>0){ doneT-=dt; return doneT<=0; }
      if(phase==="listen"){
        timer-=dt;
        if(timer<=0){
          if(idx<seq.length){
            lit=seq[idx];
            Audio.sfx.loonNote(NOTES[lit]);
            idx++; timer = misses>0?1.15:0.95;
          } else { phase="repeat"; idx=0; lit=-1; loonSay={text:"your turn, you betcha.",t:2}; }
        }
        if(timer<(misses>0?0.6:0.35)) lit=-1;
      } else if(phase==="repeat"){
        for(let k=0;k<4;k++){
          if(Input.pressed(KEYS[k])){
            if(k===seq[idx]){
              lit=k; Audio.sfx.loonNote(NOTES[k],0.7);
              Particles.burst(240+k*160,238,COLS[k],6,80);
              idx++;
              if(idx>=seq.length){
                round++;
                Audio.sfx.chime();
                if(round>=3){
                  awardKeepsake("echo");
                  doneT=1.4;
                } else {
                  loonSay={text:["not bad!","ope, you're good at this."][round-1],t:2};
                  startRound();
                }
              }
            } else {
              misses++; Audio.sfx.honk();
              loonSay={text: misses>=2 ? "here, I'll show the arrows too." : "ope. one more time, slower.",t:2.2};
              if(misses>=2) assist=true;
              phase="listen"; idx=0; timer=1.1; lit=-1;
            }
            break;
          }
        }
      }
      return false;
    },
    render(c){
      puzzleCard(c,"The Loon's Echo","repeat the loon's song with the arrow keys");
      // little dock + water inside the card
      c.fillStyle="#9AD7F2"; Draw.rr(c,130,300,VW-260,120,10); c.fill();
      c.fillStyle="#b08152"; Draw.rr(c,130,286,VW-260,18,6); c.fill();
      // loon
      Chars.loon(c,180,280,1.3,{t});
      if(loonSay) Draw.bubble(c,200,212,loonSay.text,{px:13});
      // posts with lanterns
      for(let k=0;k<4;k++){
        const px=240+k*160;
        c.fillStyle="#9a6e44"; Draw.rr(c,px-7,250,14,52,4); c.fill();
        const on = lit===k;
        if(on){
          const rg=c.createRadialGradient(px,238,4,px,238,40);
          rg.addColorStop(0,COLS[k]+""); rg.addColorStop(1,"rgba(255,255,255,0)");
          c.globalAlpha=0.5; c.fillStyle=rg; c.beginPath(); c.arc(px,238,40,0,TAU); c.fill();
          c.globalAlpha=1;
        }
        c.fillStyle=on?COLS[k]:"#e8dfd2";
        c.beginPath(); c.arc(px,238,16,0,TAU); c.fill();
        c.strokeStyle="#9a6e44"; c.lineWidth=2.5; c.beginPath(); c.arc(px,238,16,0,TAU); c.stroke();
        if(assist || phase==="repeat"){
          c.globalAlpha=assist?1:0.45;
          Draw.txt(c,GLYPH[k],px,212,20,C.ink,{out:"#fff",ow:4});
          c.globalAlpha=1;
        }
      }
      const prog="●".repeat(round)+"○".repeat(3-round);
      Draw.txt(c,prog,VW/2,395,16,C.pink);
      Draw.txt(c,phase==="listen"?"( listen... )":"sing it back!",VW/2,160,15,"#7a6a80",{style:"italic bold"});
    }
  };
})();

// ---- Memory Match under the gondola ------------------------------------
MapStuff.puzzles.match = (()=>{
  let cards, cur, flipped, lock, t, doneT, flips;
  function cardX(i){ return VW/2+((i%3)-1)*120; }
  function cardY(i){ return i<3 ? 250 : 380; }
  return {
    enter(){
      const kinds=["skis","maple","cocoa","skis","maple","cocoa"];
      // shuffle
      for(let i=kinds.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [kinds[i],kinds[j]]=[kinds[j],kinds[i]]; }
      cards=kinds.map((k,i)=>({k, up:false, matched:false, i}));
      cur=0; flipped=[]; lock=0; t=0; doneT=0; flips=0;
    },
    update(dt){
      t+=dt;
      if(doneT>0){ doneT-=dt; return doneT<=0; }
      if(lock>0){
        lock-=dt;
        if(lock<=0){
          const [a,b]=flipped;
          if(cards[a].k===cards[b].k){
            cards[a].matched=cards[b].matched=true;
            Audio.sfx.chime();
            Particles.burst(cardX(a),cardY(a),C.gold,8,90);
            Particles.burst(cardX(b),cardY(b),C.gold,8,90);
            if(cards.every(cd=>cd.matched)){ awardKeepsake("match"); doneT=1.4; }
          } else { cards[a].up=cards[b].up=false; }
          flipped=[];
        }
        return false;
      }
      if(Input.pressed("left"))  cur=(cur+5)%6;
      if(Input.pressed("right")) cur=(cur+1)%6;
      if(Input.pressed("up")||Input.pressed("down")) cur=(cur+3)%6;
      if(Input.pressed("action")){
        const cd=cards[cur];
        if(!cd.up && !cd.matched){
          cd.up=true; flips++; Audio.sfx.tick();
          flipped.push(cur);
          if(flipped.length===2) lock=0.85;
        }
      }
      return false;
    },
    render(c){
      puzzleCard(c,"Mountain Memory","arrows to choose · SPACE to flip");
      // gondola cable doodle
      c.strokeStyle="#9aa6c0"; c.lineWidth=3;
      c.beginPath(); c.moveTo(130,150); c.lineTo(VW-130,128); c.stroke();
      const gx=VW/2+Math.sin(t*0.5)*180;
      c.strokeStyle="#46557a"; c.beginPath(); c.moveTo(gx,137); c.lineTo(gx,156); c.stroke();
      c.fillStyle="#e8418f"; Draw.rr(c,gx-20,156,40,26,6); c.fill();
      for(let i=0;i<6;i++){
        const x=cardX(i), y=cardY(i);
        const cd=cards[i];
        c.save(); c.translate(x,y);
        if(i===cur && !cd.matched){
          c.strokeStyle=C.pink; c.lineWidth=4;
          Draw.rr(c,-46,-56,92,112,12); c.stroke();
        }
        if(cd.matched) c.globalAlpha=0.75;
        if(cd.up||cd.matched){
          c.fillStyle="#fff"; Draw.rr(c,-42,-52,84,104,10); c.fill();
          c.strokeStyle=C.bubble; c.lineWidth=3; Draw.rr(c,-42,-52,84,104,10); c.stroke();
          Draw.icon(c,cd.k,0,0,44);
        } else {
          c.fillStyle=C.bubble; Draw.rr(c,-42,-52,84,104,10); c.fill();
          c.strokeStyle="#fff"; c.lineWidth=3; Draw.rr(c,-36,-46,72,92,8); c.stroke();
          Draw.discoBall(c,0,0,20,1,t*0.3);
        }
        c.restore();
      }
    }
  };
})();

MapStuff.puzzles.sort = (()=>{
  const ITEMS=[
    {k:"can",rec:true},{k:"banana",rec:false},{k:"bottle",rec:true},
    {k:"paper",rec:true},{k:"ball",rec:false}
  ];
  let qi, anim, wrongs, t, doneT, lunaSay, tilt, pend;
  return {
    enter(){ qi=0; anim=null; wrongs=0; t=0; doneT=0; lunaSay=null; tilt=0; pend=0; },
    update(dt){
      t+=dt;
      tilt=Math.max(0,tilt-dt);
      if(lunaSay){ lunaSay.t-=dt; if(lunaSay.t<=0) lunaSay=null; }
      if(doneT>0){ doneT-=dt; return doneT<=0; }
      if(anim){
        anim.t+=dt;
        if(anim.t>=0.42){
          if(anim.ok){
            pend++; // eco awarded once at completion so an R-restart can't double-count
            Audio.sfx.eco();
            Particles.burst(anim.tx,330,C.mint,8,100);
            if(ITEMS[qi].k==="ball") lunaSay={text:"...we're THROWING that away?!",t:2.4};
            qi++; wrongs=0;
            if(qi>=ITEMS.length){
              G.eco+=pend; G.stats.litter+=pend;
              awardKeepsake("sort"); doneT=1.6;
            }
          } else {
            wrongs++; Audio.sfx.bonk(); tilt=1;
            lunaSay={text:wrongs>=2?"psst. the glowy one.":"hmm. other bin?",t:1.8};
          }
          anim=null;
        }
        return false;
      }
      if(qi<ITEMS.length){
        const it=ITEMS[qi];
        if(Input.pressed("left"))  anim={t:0, dir:-1, tx:250, ok:it.rec};
        if(Input.pressed("right")) anim={t:0, dir:1,  tx:710, ok:!it.rec};
        if(anim) Audio.sfx.tick();
      }
      return false;
    },
    render(c){
      puzzleCard(c,"Luna's Recycling Sort","← recycle · trash →");
      // bins
      const it=ITEMS[qi]||ITEMS[ITEMS.length-1];
      const hintRec = wrongs>=2 && it.rec, hintTr = wrongs>=2 && !it.rec;
      // recycle bin
      c.save(); c.translate(250,330);
      if(hintRec){ c.shadowBlur=0; const rg=c.createRadialGradient(0,0,8,0,0,70);
        rg.addColorStop(0,"rgba(159,232,200,0.55)"); rg.addColorStop(1,"rgba(159,232,200,0)");
        c.fillStyle=rg; c.beginPath(); c.arc(0,0,70,0,TAU); c.fill(); }
      c.fillStyle="#3f7fb8"; Draw.rr(c,-44,-46,88,92,8); c.fill();
      c.fillStyle="#356c9d"; Draw.rr(c,-50,-56,100,14,6); c.fill();
      Draw.icon(c,"recycle",0,0,42);
      c.restore();
      // trash bin
      c.save(); c.translate(710,330);
      if(hintTr){ const rg=c.createRadialGradient(0,0,8,0,0,70);
        rg.addColorStop(0,"rgba(201,167,245,0.5)"); rg.addColorStop(1,"rgba(201,167,245,0)");
        c.fillStyle=rg; c.beginPath(); c.arc(0,0,70,0,TAU); c.fill(); }
      c.fillStyle="#7d8597"; Draw.rr(c,-44,-46,88,92,8); c.fill();
      c.fillStyle="#6a7184"; Draw.rr(c,-50,-56,100,14,6); c.fill();
      Draw.txt(c,"TRASH",0,4,15,"#fff");
      c.restore();
      // current item
      if(qi<ITEMS.length){
        let ix=VW/2, iy=250;
        if(anim){
          const k=easeIn(anim.t/0.42);
          ix=lerp(VW/2,anim.tx,k); iy=250+Math.sin(k*Math.PI)*-60+k*60;
        } else iy=250+Math.sin(t*2.4)*6;
        c.fillStyle="rgba(30,42,68,0.12)";
        c.beginPath(); c.ellipse(VW/2,296,30,7,0,0,TAU); c.fill();
        Draw.icon(c,it.k,ix,iy,40);
      }
      // Luna watching
      c.save(); c.translate(VW/2,425);
      if(tilt>0) c.rotate(Math.sin(tilt*4)*0.12);
      Chars.luna(c,0,0,1.25,{t,wag:true});
      c.restore();
      if(lunaSay) Draw.bubble(c,VW/2+30,352,lunaSay.text,{px:13});
      const prog="●".repeat(qi)+"○".repeat(Math.max(0,ITEMS.length-qi));
      Draw.txt(c,prog,VW/2,160,16,C.pink);
    }
  };
})();

    "Solar-powered. Carbon neutral. Sworn companion of birthday heroes. It's a whole thing.",
    "Hop on. We ride at — what time is it? We ride NOW."
  ];

  function buildBg(){
    bg=document.createElement("canvas"); bg.width=VW; bg.height=VH;
    const c=bg.getContext("2d");
    const g=c.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#7CC4EE"); g.addColorStop(0.5,"#AEDFF5"); g.addColorStop(1,"#D8F0E2");
    c.fillStyle=g; c.fillRect(0,0,VW,VH);
    const sg=c.createRadialGradient(180,80,8,180,80,80);
    sg.addColorStop(0,"rgba(255,248,220,0.95)"); sg.addColorStop(1,"rgba(255,248,220,0)");
    c.fillStyle=sg; c.beginPath(); c.arc(180,80,80,0,TAU); c.fill();
    c.fillStyle="#FFF6D8"; c.beginPath(); c.arc(180,80,24,0,TAU); c.fill();
    function peak(px2,h,w,col){
      c.fillStyle=col;
      c.beginPath(); c.moveTo(px2-w,330); c.lineTo(px2,330-h); c.lineTo(px2+w,330); c.closePath(); c.fill();
      c.fillStyle="#FFF8FC";
      c.beginPath(); c.moveTo(px2-w*0.35,330-h*0.6); c.lineTo(px2,330-h);
      c.lineTo(px2+w*0.35,330-h*0.6); c.lineTo(px2+0.15*w,330-h*0.5);
      c.lineTo(px2,330-h*0.62); c.lineTo(px2-0.15*w,330-h*0.48); c.closePath(); c.fill();
    }
    peak(140,150,170,"#8d9fc7"); peak(420,120,150,"#98a8cc"); peak(700,160,180,"#7d8fc0"); peak(910,110,130,"#98a8cc");
    // meadow base
    const mg=c.createLinearGradient(0,330,0,VH);
    mg.addColorStop(0,"#BFE8C8"); mg.addColorStop(1,"#9FE8C8");
    c.fillStyle=mg; c.fillRect(0,330,VW,VH-330);
  }

  function gen(){
    plats=[{x:1080,y:GY-72,w:110,h:12},{x:1980,y:GY-80,w:90,h:12}];
    berries=[
      {x:800,  y:GY-26,  taken:false},
      {x:1700, y:GY-26,  taken:false},
      {x:2600, y:GY-26,  taken:false},
      {x:1135, y:GY-118, taken:false},
      {x:2025, y:GY-126, taken:false}
    ];
    npcs=[
      {x:520, who:"loon", talked:false, lines:[
        "Ope. Surprised? I summer in the alpine.",
        "This is the glade where Glitter got... sparked. Born. Sparked-born.",
        "A shard fell off the FIRST Disco Ball of 25, hit this meadow — boom. Unicorn. You betcha."]},
      {x:1350, who:"deer", talked:false, lines:[
        "Glitter? Local legend. Runs on 100% renewable sparkle. Solar mane. Zero emissions.",
        "She once jump-started the northern lights with a sneeze.",
        "She's dozing by the big larch. Bring her the glowberries. It's an electrolyte thing."]},
      {x:2350, who:"glitter", talked:false, lines:[
        "zzz... five more sparkle-berries... I mean minutes...",
        "(she's solar charging. the berries finish the job.)"]}
    ];
    // wildflower field, deterministic
    flowers=[];
    srand(2506);
    for(let i=0;i<90;i++){
      flowers.push({x:60+rnd()*(WX-120), y:GY+6+rnd()*70,
        col:[C.pink,C.gold,C.bubble,C.lav,"#fff"][(rnd()*5)|0], s:rndR(2,3.6)});
    }
  }

  function drawDeer(c,x2,y2,t2){
    c.save(); c.translate(x2,y2);
    const flick=Math.sin(t2*0.8)>0.94;
    c.fillStyle="#9a7450";
    c.beginPath(); c.ellipse(0,-22,14,9,0,0,TAU); c.fill();      // body
    c.strokeStyle="#9a7450"; c.lineWidth=2.6; c.lineCap="round"; // legs
    for(const lx2 of [-9,-4,5,10]){ c.beginPath(); c.moveTo(lx2,-15); c.lineTo(lx2,0); c.stroke(); }
    c.beginPath(); c.ellipse(13,-32,5,6,0.3,0,TAU); c.fill();    // neck
    c.fillStyle="#a8845e"; c.beginPath(); c.arc(16,-40,4.6,0,TAU); c.fill(); // head
    c.beginPath(); c.ellipse(20,-38.6,2.6,1.8,0.2,0,TAU); c.fill();
    c.fillStyle="#9a7450";
    c.beginPath(); c.ellipse(13,-45.5,1.6,3,flick?0.5:0.2,0,TAU); c.fill(); // ears
    c.beginPath(); c.ellipse(17.5,-45.5,1.6,3,-0.1,0,TAU); c.fill();
    c.strokeStyle="#7a5a40"; c.lineWidth=1.6;                    // antlers
    c.beginPath(); c.moveTo(14,-47); c.lineTo(12,-52); c.moveTo(13,-50); c.lineTo(10.5,-52); c.stroke();
    c.beginPath(); c.moveTo(17,-47); c.lineTo(19,-52); c.moveTo(18,-50); c.lineTo(20.5,-52); c.stroke();
    circDeer(c,21.4,-40.4,1.1,"#2c2018");                        // eye
    c.fillStyle="#fff"; c.beginPath(); c.ellipse(-13,-24,2.6,3.4,0.4,0,TAU); c.fill(); // tail
    c.restore();
    function circDeer(c2,a,b,r,col){ c2.fillStyle=col; c2.beginPath(); c2.arc(a,b,r,0,TAU); c2.fill(); }
  }

  return {
    showHUD:false, pausable:true,
    sneezeAnchor(){ return {x:px-camX, y:py-40}; },
    enter(params){
      if(params && params.restart && snap){ G.keepsakes.glowberry=snap.glow; }
      else snap={glow:G.keepsakes.glowberry};
      t=0; px=140; py=GY; pvx=0; pvy=0; grounded=true; coyote=0; jbuf=0; facing=1;
      camX=0; squash=0; phase="roam"; mounted=false; got=0; dlg=null; feedT=0; outro=null;
      gen();
      if(!bg) buildBg();
      Audio.playSong("peaks");
    },
    skip(){ finishLevel(); },
    update(dt){
      t+=dt;
      if(outro){
        outro.t+=dt;
        if(Input.pressed("action") && outro.t>0.7) finishLevel();
        return;
      }
      // ---- dialogue mode: input belongs to the conversation ----
      if(phase==="talk"){
        if(Input.pressed("action")){
          dlg.i++;
          Audio.sfx.tick();
          if(dlg.i>=dlg.lines.length){
            if(dlg.npc) dlg.npc.talked=true;
            const wasWake = dlg.wake;
            dlg=null; phase="roam";
            if(wasWake){
              mounted=true;
              Game.toast("GLITTER ACQUIRED. ride west! →",C.pink);
              Audio.sfx.chime();
            }
          }
        }
        return;
      }
      if(phase==="summon"){ // she heard the berries. she's coming.
        const gl=npcs.find(n=>n.who==="glitter");
        const tx=px-72;
        gl.x += clamp(tx-gl.x, -360*dt, 360*dt);
        if(!Game.rm && Math.random()<0.4)
          Particles.spawn({x:gl.x-camX-20,y:GY-24+rndR(-10,10),vx:-40,vy:rndR(-20,0),
            life:0.5,size:3.5,col:C.gold,shape:"star",tw:1});
        if(Math.abs(gl.x-tx)<10){ phase="feed"; feedT=0; Audio.sfx.eco(); }
        return;
      }
      if(phase==="feed"){
        const gl=npcs.find(n=>n.who==="glitter");
        feedT+=dt;
        if(!Game.rm && feedT<0.8 && Math.random()<0.7){
          const k=feedT/0.8;
          Particles.spawn({x:lerp(px-camX,gl.x-camX,k)+rndR(-8,8),y:lerp(py-30,GY-40,k),
            vx:0,vy:-20,life:0.5,size:4,col:C.gold,shape:"star",tw:1});
        }
        if(feedT>=0.9){
          Particles.burst(gl.x-camX,GY-44,C.gold,22,180);
          Particles.confetti(gl.x-camX,GY-60,16);
          Audio.sfx.pop();
          if(!G.keepsakes.glowberry) awardKeepsake("glowberry");
          dlg={npc:null, lines:WAKE, i:0, wake:true, x:gl.x};
          phase="talk";
        }
        return;
      }
      // ---- roam: talk checks BEFORE movement so SPACE doesn't double as jump ----
      let near=null;
      for(const n of npcs){
        if(n.who==="glitter" && mounted) continue; // she's under the saddle, not by the larch
        if(Math.abs(px-n.x)<52 && grounded){ near=n; break; }
      }
      if(near && Input.pressed("action")){
        if(near.who==="glitter" && got>=5){
          phase="feed"; feedT=0;
          Audio.sfx.eco();
        } else {
          dlg={npc:near, lines:near.lines, i:0, x:near.x};
          phase="talk";
          Audio.sfx.tick();
        }
        return;
      }
      // ---- movement (L4's tuned platformer, mount-aware) ----
      const MV = mounted? MOVE.mount : MOVE.foot;
      let dir=0;
      if(Input.held("left")) dir-=1;
      if(Input.held("right")) dir+=1;
      if(dir!==0) facing=dir;
      const targetV=dir*MV.run;
      const rate = dir!==0 ? (grounded?MV.accelG:MV.accelA) : (grounded?MV.brake:300);
      pvx += clamp(targetV-pvx, -rate*dt, rate*dt);
      px = clamp(px+pvx*dt, 40, WX-40);
      jbuf=Math.max(0,jbuf-dt); coyote=Math.max(0,coyote-dt);
      if(Input.pressed("action")) jbuf=0.12;
      if(jbuf>0 && (grounded||coyote>0)){
        jbuf=0; coyote=0; grounded=false;
        pvy=MV.jump; squash=-1;
        Audio.sfx.tick();
      }
      const wasG=grounded;
      pvy += 2200*dt;
      py += pvy*dt;
      grounded=false;
      if(py>=GY){ py=GY; pvy=0; grounded=true; }
      else if(pvy>0){
        for(const p of plats){
          if(px>p.x-10 && px<p.x+p.w+10 && py>=p.y && py-pvy*dt<=p.y+14){ py=p.y; pvy=0; grounded=true; break; }
        }
      }
      if(!grounded && wasG && pvy>=0) coyote=0.1;
      if(grounded && !wasG){ squash=1; Particles.burst(px-camX,py,"#cfe0d8",4,50); }
      squash*=(1-7*dt);
      camX = clamp(px-330, 0, WX-VW);
      // mounted rainbow trail
      if(mounted && Math.abs(pvx)>60 && !Game.rm && Math.random()<0.65){
        const cols=[C.pink,C.gold,C.mint,C.lake,C.lav];
        Particles.spawn({x:px-camX-facing*22,y:py-18+rndR(-8,8),vx:-facing*rndR(30,80),vy:rndR(-20,20),
          life:0.6,size:4,col:cols[(Math.random()*5)|0],shape:"star",drag:0.95,tw:1});
      }
      // berries
      for(const b of berries){
        if(b.taken) continue;
        if(hit(px,py-18,26*G.hitScale(),b.x,b.y,16)){
          b.taken=true; got++;
          Audio.sfx.eco();
          Particles.burst(b.x-camX,b.y,C.gold,12,120);
          Game.toast(got>=5 ? "5/5!! bring them to Glitter ✨" : "glowberry "+got+"/5 ✨", C.gold);
        }
      }
      // reached the gate on foot? Glitter comes to YOU (no backtracking at a birthday party)
      if(px>2740 && !mounted){
        if(got>=5){ phase="summon"; Game.toast("Glitter heard the berries. incoming!!",C.gold); return; }
        if(!this._nudgeT || Game.time-this._nudgeT>4){
          this._nudgeT=Game.time;
          Game.toast("the gate wants a unicorn — find "+(5-got)+" more glowberries first ✨",C.lav);
        }
      }
      // exit
      if(mounted && px>2820 && !outro){
        outro={t:0};
        Particles.confetti(2880-camX,300,30);
        Audio.sfx.chime();
      }
    },
    render(c){
      c.drawImage(bg,0,0);
      c.save(); c.translate(-camX,0);
      // meadow ground strip + path
      c.fillStyle="#8fd8b4"; c.fillRect(0,GY+4,WX,VH-GY);
      c.fillStyle="#c9b8a4"; c.fillRect(0,GY+8,WX,12);
      // flowers
      for(const f of flowers){
        if(f.x<camX-30||f.x>camX+VW+30) continue;
        c.strokeStyle="#5fae6e"; c.lineWidth=1.4;
        c.beginPath(); c.moveTo(f.x,f.y); c.lineTo(f.x,f.y-6); c.stroke();
        Draw.star(c,f.x,f.y-8,f.s,f.col);
      }
      // big golden larch by Glitter
      c.save(); c.translate(2380,GY);
      c.fillStyle="#7a5a40"; Draw.rr(c,-7,-110,14,110,5); c.fill();
      for(let k=0;k<4;k++){
        const w=34-k*7, ty=-100-k*26;
        c.fillStyle=k%2?"#E8B33C":"#D89A2B";
        c.beginPath(); c.moveTo(0,ty-30); c.lineTo(w,ty); c.lineTo(-w,ty); c.closePath(); c.fill();
      }
      c.restore();
      // platforms (mossy rocks)
      for(const p of plats){
        c.fillStyle="#9aa6c0"; Draw.rr(c,p.x,p.y,p.w,16,8); c.fill();
        c.fillStyle="#7fcf9f"; Draw.rr(c,p.x+6,p.y-3,p.w-12,7,4); c.fill();
      }
      // berries
      for(const b of berries){
        if(b.taken) continue;
        const bob=Math.sin(t*2.6+b.x)*4;
        Draw.icon(c,"berry",b.x,b.y+bob,26);
      }
      // NPCs
      for(const n of npcs){
        if(n.who==="loon") Chars.loon(c,n.x,GY,1.2,{t});
        else if(n.who==="deer") drawDeer(c,n.x,GY,t);
        else if(n.who==="glitter"){
          if(!mounted){
            if(phase==="summon"){
              Chars.glitter(c,n.x,GY,1.2,{t,trot:true,sparkle:true});
            } else {
              c.save(); c.translate(n.x,GY);
              c.translate(0,10); // lying low, dozing
              Chars.glitter(c,0,0,1.2,{t,sparkle:false});
              c.restore();
              if(phase==="roam"){
                const zz=Math.floor(t*1.2)%3;
                Draw.txt(c,"z".repeat(zz+1),n.x+34,GY-66-Math.sin(t*1.4)*4,15,C.lav,{style:"italic bold"});
              }
            }
          }
        }
        // talk prompt
        if(phase==="roam" && Math.abs(px-n.x)<52 && grounded && !(n.who==="glitter"&&mounted)){
          c.globalAlpha=0.7+0.3*Math.sin(t*5);
          Draw.txt(c, n.who==="glitter"&&got>=5 ? "SPACE: share the glowberries" : "SPACE: say hi",
            n.x, GY-86, 14, C.ink, {out:"#fff",ow:4});
          c.globalAlpha=1;
        }
      }
      // exit gate: birch posts + flower arch
      c.save(); c.translate(2880,GY);
      for(const sg of [-1,1]){
        c.fillStyle="#f2ead8"; Draw.rr(c,sg*44-6,-118,12,118,5); c.fill();
        c.fillStyle="#c9bda4";
        for(let k2=0;k2<4;k2++) c.fillRect(sg*44-6,-100+k2*26,12,3);
      }
      c.strokeStyle="#5fae6e"; c.lineWidth=7;
      c.beginPath(); c.arc(0,-110,46,Math.PI,TAU); c.stroke();
      srand(77);
      for(let k2=0;k2<9;k2++){
        const a=Math.PI+k2/8*Math.PI;
        Draw.star(c,Math.cos(a)*46,-110+Math.sin(a)*46,3.4,[C.pink,C.gold,C.bubble][(rnd()*3)|0]);
      }
      c.globalAlpha=0.35+0.15*Math.sin(t*3);
      const gg=c.createLinearGradient(0,-110,0,0);
      gg.addColorStop(0,"rgba(255,214,107,0.6)"); gg.addColorStop(1,"rgba(255,214,107,0)");
      c.fillStyle=gg; c.fillRect(-40,-110,80,110);
      c.globalAlpha=1;
      Draw.txt(c,"→ Whistler",0,-132,13,"#7a6a80",{out:"#fff",ow:4});
      c.restore();
      // player (on foot or riding)
      const lsq=1+squash*0.13;
      if(mounted){
        c.save(); c.translate(px,py);
        c.scale((facing<0?-1:1)/Math.sqrt(Math.abs(lsq)||1),lsq);
        Chars.glitter(c,0,0,1.15,{t,trot:Math.abs(pvx)>40,sparkle:true});
        Chars.mariah(c,2,-30,0.55,{pose:"sit"});
        c.restore();
      } else {
        c.save(); c.translate(px,py);
        c.scale((facing<0?-1:1)/Math.sqrt(Math.abs(lsq)||1),lsq);
        Chars.mariah(c,0,0,0.9,{bounce:grounded&&Math.abs(pvx)>40 ? Math.abs(Math.sin(t*9)) : 0});
        c.restore();
      }
      c.restore();
      // dialogue bubble (screen space, after restore)
      if(phase==="talk" && dlg){
        const bx=clamp((dlg.x||px)-camX, 120, VW-120);
        Draw.bubble(c,bx,GY-96,dlg.lines[dlg.i],{px:15});
        c.globalAlpha=0.6+0.4*Math.sin(t*5);
        Draw.txt(c,"SPACE",bx,GY-66,12,C.pink,{out:"#fff",ow:3});
        c.globalAlpha=1;
      }
      if(phase==="feed"){
        Draw.txt(c,"sharing the glowberries...",VW/2,150,18,C.gold,{out:"#fff",ow:5});
      }
      // berry chip + always-visible objective hint
      c.fillStyle="rgba(255,253,246,0.85)"; Draw.rr(c,14,14,118,38,12); c.fill();
      c.strokeStyle=C.bubble; c.lineWidth=2; Draw.rr(c,14,14,118,38,12); c.stroke();
      Draw.icon(c,"berry",38,33,24);
      Draw.txt(c,got+" / 5",84,33,17,C.ink,{align:"left"});
      {
        const gl=npcs.find(n=>n.who==="glitter");
        let hint;
        if(mounted) hint="ride east to the flower gate! →";
        else if(phase==="summon"||phase==="feed") hint="here she comes!!";
        else if(got>=5) hint=(gl.x>px?"→":"←")+" share the berries with Glitter (big golden tree)";
        else hint="collect the glowing berries ✨";
        Draw.txt(c,hint,20,68,13.5,C.ink,{align:"left",out:"#fff",ow:4});
      }
      // outro card
      if(outro){
        const a=clamp(outro.t*1.6,0,1);
        c.globalAlpha=a;
        c.fillStyle="rgba(255,253,246,0.96)"; Draw.rr(c,VW/2-260,150,520,200,16); c.fill();
        c.strokeStyle=C.gold; c.lineWidth=4; Draw.rr(c,VW/2-260,150,520,200,16); c.stroke();
        Draw.txt(c,"GLITTER'S GLADE ✓",VW/2,192,26,"#c98a1f",{out:"#fff",ow:6});
        Draw.txt(c,"glowberries "+got+"/5 · unicorn: acquired",VW/2,238,18,C.ink);
        Draw.txt(c,"(her decision, technically.)",VW/2,272,16,"#5f4f68");
        c.globalAlpha=a*(0.6+0.4*Math.sin(t*5));
        Draw.txt(c,"SPACE: to Whistler!",VW/2,318,18,"#c98a1f",{out:"#fff",ow:4});
        c.globalAlpha=1;
      }
      Draw.vignette(c);
    }
  };
})());

// ================= S15d THE GORGE AMPHITHEATRE =========================
Scenes.add("GORGE", (()=>{
  const BPM=126, SPB=60/BPM, TRAVEL=1.8, HITY=396, CX=480, LASTBEAT=80;
  const LANES=[CX-135,CX-45,CX+45,CX+135];
  const LKEY=["left","down","up","right"], LGLYPH=["←","↓","↑","→"];
  let t, chart, startT, combo, maxCombo, tier, judge, dropped, danceEndT, fireT, outro, flashT;
  let bg=null;

  function now(){ return Audio.state().unlocked ? Audio.songTime()-Audio.pausedTotal() : Game.time; }

  function buildChart(){
    chart=[];
    const order=[0,2,3,1];
    for(let b=0;b<16;b+=2) chart.push({beat:b, lane:order[(b/2)%4]});
    for(let b=16;b<32;b++) chart.push({beat:b, lane:order[b%4]});
    for(let b=32;b<64;b++){
      chart.push({beat:b, lane:(b*5)%4});
      if(b%4===2) chart.push({beat:b+0.5, lane:(b*5+1)%4});
    }
    for(let b=64;b<LASTBEAT;b++) chart.push({beat:b, lane:(b*7)%4});
    for(let l=0;l<4;l++) chart.push({beat:LASTBEAT, lane:l});
    for(const n of chart){ n.hit=false; n.missed=false; }
  }

  function buildBg(){
    bg=document.createElement("canvas"); bg.width=VW; bg.height=VH;
    const c=bg.getContext("2d");
    const g=c.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#0a1228"); g.addColorStop(0.6,"#16203c"); g.addColorStop(1,"#251c40");

    srand(412);
    c.fillStyle="rgba(255,248,252,0.8)";
    for(let i=0;i<80;i++){ c.fillRect(rnd()*VW, rnd()*170, rnd()<0.3?2:1.4, 1.4); }
    // the Columbia, moonlit, behind the stage
    c.fillStyle="#2b3a5e"; c.fillRect(0,212,VW,40);
    c.fillStyle="rgba(201,167,245,0.3)";
    for(let i=0;i<12;i++) c.fillRect(srandX(i), 218+(i%3)*9, 30, 2);
    function srandX(i){ return (i*83+40)%VW; }
    // terraced canyon walls
    c.fillStyle="#1c2440";
    c.beginPath(); c.moveTo(0,252); c.lineTo(0,120);
    c.lineTo(80,128); c.lineTo(96,160); c.lineTo(170,168); c.lineTo(186,206); c.lineTo(250,212); c.lineTo(250,252);
    c.closePath(); c.fill();
    c.beginPath(); c.moveTo(VW,252); c.lineTo(VW,110);
    c.lineTo(VW-90,120); c.lineTo(VW-104,156); c.lineTo(VW-180,164); c.lineTo(VW-196,204); c.lineTo(VW-260,210); c.lineTo(VW-260,252);
    c.closePath(); c.fill();
    c.fillStyle="#141c34";
    c.beginPath(); c.moveTo(0,252); c.lineTo(120,244); c.lineTo(300,252); c.lineTo(0,260); c.closePath(); c.fill();
    // stage
    c.fillStyle="#10162c"; Draw.rr(c,CX-210,250,420,180,10); c.fill();
    c.fillStyle="#0a0f20"; c.fillRect(CX-210,404,420,26);
    // speaker stacks
    for(const sg of [-1,1]){

  function crowdRow(c,y2,n,amp,seedo){

    update(dt){
      t+=dt;
      flashT=Math.max(0,flashT-dt*1.6);

        outro.t+=dt;

      // judge input
      for(let l=0;l<4;l++){

          if(d<bestD){ bestD=d; best=n; }

        const win=G.sparkleMode?0.19:0.13;

          best.hit=true; combo++;
          maxCombo=Math.max(maxCombo,combo);
          judge={text:bestD<0.06?"PERFECT!":"yes!!",t:0.5,col:bestD<0.06?C.gold:C.mint};
          Audio.sfx.tick();
          Particles.burst(LANES[l],HITY,C.lav,8,110);
          const newTier = combo>=24?4: combo>=16?3: combo>=8?2: combo>=4?1: tier;

      }
      if(!danceEndT && tm>startT+LASTBEAT*SPB+1.6) danceEndT=tm;

        Audio.setLayer(4);
        Game.shake(3,0.2);

      // DJ loon on the decks
      const bob=Math.abs(Math.sin(Game.time*4.2))*(2+tier);

      c.fillStyle="#10162c";

      c.beginPath(); c.arc(CX+26,330,3,0,TAU); c.fill();
      Chars.loon(c,CX,322-bob,1.25,{t:Game.time});

      c.beginPath(); c.arc(CX+14,294-bob,7,Math.PI*0.9,Math.PI*1.9); c.stroke();

      // crowd: two rows + Mariah and Glitter front row

        if(tm<startT+2) Draw.txt(c,"arrows on the ring — the canyon doesn't judge",CX,448,16,C.bubble,{out:C.night,ow:5});
      }
      if(fireT>0){

      }
      if(flashT>0 && !Game.rm){

      } else if(flashT>0){

        Draw.txt(c,"SPACE: on to Green Lake!",VW/2,318,18,"#8a63d2",{out:"#fff",ow:4});

Scenes.add("FINALE", (()=>{

  function now(){ return Audio.state().unlocked ? Audio.songTime()-Audio.pausedTotal() : Game.time; }

  function buildChart(){
    chart=[];
    const order=[0,2,3,1];
    for(let b=0;b<16;b+=2) chart.push({beat:b, lane:order[(b/2)%4]});
    for(let b=16;b<32;b++) chart.push({beat:b, lane:order[b%4]});
    for(let b=32;b<48;b++){
      chart.push({beat:b, lane:(b*5)%4});
      if(b%4===2) chart.push({beat:b+0.5, lane:(b*5+1)%4});
    }
    for(let b=48;b<64;b++){
      if(b%4===0){ chart.push({beat:b, lane:0}); chart.push({beat:b, lane:3}); }
      else chart.push({beat:b, lane:(b*3)%4});
    }
    for(let b=64;b<79;b++) chart.push({beat:b, lane:(b*7)%4});
    for(let l=0;l<4;l++) chart.push({beat:79, lane:l});
    for(const n of chart){ n.hit=false; n.missed=false; }

                  : side===2?{x:rndR(60,900),y:-40} : {x:rndR(60,900),y:VH+40};

      beat="DANCE"; t=0;
      this._lastTm=undefined; // fresh clock anchor — heals only genuine mid-dance gaps
      Audio.playSong("disco"); Audio.setLayer(0);
      // chart beat 0 lands on a kick (scheduler anchors +0.08) with a full-lane lead-in
      startT=now()+0.08+4*SPB;
    },
    _toCake(){
      beat="CAKE"; t=0; cart={x:VW+260}; dimT=0;
      Audio.stopSong();
    },
    _toLetter(){
      beat="LETTER"; t=0; para=0; chIdx=0; sigT=0; letterDone=false;
      Audio.playSong("title");
    },
    update(dt){
      t+=dt; ballSpin+=dt*(beat==="REBUILD"? 0.3+charge*2 : 0.8);
      flashT=Math.max(0,flashT-dt*1.4);
      if(judge){ judge.t-=dt; if(judge.t<=0) judge=null; }

      if(beat==="REBUILD"){
        let allArrived=true;
        for(const fx of shardsFx){
          if(fx.arrived) continue;
          fx.delay-=dt;
          if(fx.delay<=0){
            fx.t+=dt/0.9;
            if(fx.t>=1){ fx.arrived=true; Audio.sfx.tick(); }
          }
          if(!fx.arrived) allArrived=false;
        }
        if(allArrived && !prompt){ prompt=true; Audio.sfx.chime(); }
        if(prompt && charge<1){
          const before=charge;
          if(Input.held("action")) charge=Math.min(1,charge+dt/3);
          else charge=Math.max(0,charge-dt*0.22);
          for(const th of [0.25,0.5,0.75]) if(before<th&&charge>=th) Audio.sfx.chime();
          if(charge>=1){
            flashT=1; Audio.sfx.pop();
            Particles.confetti(CX,260,40);
            Game.shake(5,0.3);
            setTimeoutSafe(()=>{ if(beat==="REBUILD") this._toDance(); },1.6);
          }
        }
      }
      else if(beat==="DANCE"){
        let tm=now();
        // self-heal after pause/tab-switch: audio clock kept running, shift the chart
        if(this._lastTm!==undefined && tm-this._lastTm>0.4){
          startT += tm-this._lastTm;
          if(danceEndT) danceEndT += tm-this._lastTm;
        }
        this._lastTm=tm;
        // judge input
        for(let l=0;l<4;l++){
          if(!Input.pressed(LKEY[l])) continue;
          let best=null, bestD=1;
          for(const n of chart){
            if(n.hit||n.missed||n.lane!==l) continue;
            const d=Math.abs(tm-(startT+n.beat*SPB));
            if(d<bestD){ bestD=d; best=n; }
          }
          const win=G.sparkleMode?0.19:0.13;
          if(best && bestD<=win){
            best.hit=true; hits++; combo++;
            maxCombo=Math.max(maxCombo,combo);
            judge={text:bestD<0.06?"PERFECT!":"nice!",t:0.5,col:bestD<0.06?C.gold:C.mint};
            Audio.sfx.tick();
            Particles.burst(LANES[l],HITY,C.gold,8,110);
            const newTier = combo>=24?4: combo>=16?3: combo>=8?2: combo>=4?1: tier;
            if(newTier>tier){ tier=newTier; Audio.setLayer(tier); Game.toast(["","the hats join in!","BASSLINE.","horns!! kind of!!","FULL DISCO."][tier],C.lav); }
          }
        }
        // misses just fade
        for(const n of chart){
          if(!n.hit && !n.missed && tm>startT+n.beat*SPB+0.25){ n.missed=true; combo=0; }
        }
        if(!danceEndT && tm>startT+(79*SPB)+1.6) danceEndT=tm;
        if(danceEndT && tm>danceEndT+1.2) this._toCake();
        if(!Game.rm && Math.random()<0.06+tier*0.07) Particles.confetti(Math.random()*VW,80,3+tier*2);
      }
      else if(beat==="CAKE"){
        if(cart.x>CX){ cart.x=Math.max(CX,cart.x-260*dt); if(cart.x===CX) Audio.sfx.chime(); }
        for(const cd of candles) cd.fl+=dt*9;
        if(blowing){
          blowing.t+=dt;
          const k=Math.floor(blowing.t/0.06);
          let n=0;
          for(let i=0;i<candles.length;i++){
            if(i<=k && !candles[i].out){
              candles[i].out=true;
              if(i%2===0) Audio.sfx.puff();
              Particles.spawn({x:candles[i].x,y:candles[i].y-16,vx:rndR(-8,8),vy:-26,life:1.1,
                size:5,col:"rgba(180,180,200,0.5)",shape:"dot",drag:0.97});
            }
            if(candles[i].out) n++;
          }
          dimT=n/25;
          if(n>=25 && blowing.t>25*0.06+1.6) this._toLetter();
        } else if(cart.x===CX && t>1 && Input.pressed("action")){
          blowing={t:0};
        }
      }
      else if(beat==="LETTER"){
        if(!Game.rm && Math.random()<0.2)
          Particles.spawn({x:Math.random()*VW,y:Math.random()*VH,vx:0,vy:rndR(-8,-3),life:2.8,
            size:2.5,col:Math.random()<0.5?C.bubble:C.gold,shape:"star",tw:1});
        if(para<CONFIG.letter.length){
          const target=CONFIG.letter[para].length;
          const was=Math.floor(chIdx);
          chIdx=Math.min(target,chIdx+dt*30);
          if(Math.floor(chIdx)>was && Math.floor(chIdx)%3===0) Audio.sfx.tick();
          if(Input.pressed("action")){
            if(chIdx<target) chIdx=target;
            else { para++; chIdx=0; }
          }
        } else if(sigT<1){
          sigT=Math.min(1,sigT+dt*0.7);
        } else if(Input.pressed("action")){
          beat="END"; t=0;
          Audio.playSong("disco"); Audio.setLayer(9);
          G.save();
        }
      }
      else if(beat==="END"){
        if(!Game.rm && Math.random()<0.5) Particles.confetti(Math.random()*VW,60,4);
        if(Game.keyOnce.KeyX){ G.reset(); Save.clear(); Scenes.go("TITLE"); }
      }
    },
    render(c){
      const intensity = beat==="REBUILD"? charge : beat==="DANCE"? 0.3+tier*0.18 : beat==="END"? 1 : 0.1;
      floorAndLights(c, beat==="CAKE"||beat==="LETTER" ? 0 : intensity);

      if(beat==="REBUILD"){
        crowd(c,1.5);
        // orbiting shards
        const R=lerp(170,42,easeInOut(charge));
        const spd=0.6+charge*2.6;
        let i=0;
        for(const fx of shardsFx){
          let sx,sy;
          if(!fx.arrived && fx.from){
            const k=easeOut(clamp(fx.t,0,1));
            const tx=CX+Math.cos(fx.ang+Game.time*spd)*R, ty=BALLY+Math.sin(fx.ang+Game.time*spd)*R*0.62;
            sx=lerp(fx.from.x,tx,k); sy=lerp(fx.from.y,ty,k);
            if(fx.delay<=0 && !Game.rm) Particles.spawn({x:sx,y:sy,vx:0,vy:0,life:0.4,size:3,col:C.gold,shape:"star",tw:1});
          } else {
            sx=CX+Math.cos(fx.ang+Game.time*spd)*R;
            sy=BALLY+Math.sin(fx.ang+Game.time*spd)*R*0.62;
          }
          Draw.shardGem(c,sx,sy,10+charge*3,0.6+charge*0.4);
          i++;
        }
        if(charge>=1||flashT>0){
          Draw.discoBall(c,CX,BALLY,86,1,ballSpin,{string:60,rows:8});
        }
        if(prompt && charge<1){
          const pulse=0.65+0.35*Math.sin(Game.time*5);
          Draw.txt(c,"HOLD SPACE to rebuild the Disco Ball of 25!",CX,388,22,C.white,{out:C.pink,ow:6});
          c.globalAlpha=pulse;
          Draw.txt(c,"(you cannot mess this up. it's the rules.)",CX,418,13,C.bubble);
          c.globalAlpha=1;
          // charge meter
          c.fillStyle="rgba(255,255,255,0.15)"; Draw.rr(c,CX-180,348,360,18,9); c.fill();
          const cg=c.createLinearGradient(CX-180,0,CX+180,0);
          cg.addColorStop(0,C.bubble); cg.addColorStop(1,C.gold);
          c.fillStyle=cg; Draw.rr(c,CX-177,351,354*charge,12,6); c.fill();
        } else if(!prompt){
          Draw.txt(c,"the shards remember where they belong...",CX,388,17,C.bubble,{style:"italic bold"});
        }
        if(charge>=1) Draw.txt(c,"IT'S BEAUTIFUL.",CX,360,24,C.gold,{out:C.pink,ow:6});
      }
      else if(beat==="DANCE"){
        Draw.discoBall(c,CX,BALLY-60,62,1,ballSpin,{string:40,rows:7});
        crowd(c,2+tier*2.2);
        const tm=now();
        // lanes
        for(let l=0;l<4;l++){
          c.fillStyle="rgba(255,255,255,0.05)";
          Draw.rr(c,LANES[l]-26,40,52,HITY-20,12); c.fill();
          c.strokeStyle="rgba(255,255,255,0.4)"; c.lineWidth=2.5;
          c.beginPath(); c.arc(LANES[l],HITY,24,0,TAU); c.stroke();
          Draw.txt(c,LGLYPH[l],LANES[l],HITY,19,"rgba(255,255,255,0.55)");
        }
        // notes
        for(const n of chart){
          if(n.hit) continue;
          const nt=startT+n.beat*SPB;
          const k=1-(nt-tm)/TRAVEL;
          if(k<0||k>1.25) continue;
          const ny=lerp(-20,HITY,k);
          c.globalAlpha = n.missed? Math.max(0,1-(k-1)*4) : 1;
          c.fillStyle=[C.pink,C.lake,C.mint,C.lav][n.lane];
          c.beginPath(); c.arc(LANES[n.lane],ny,17,0,TAU); c.fill();
          Draw.txt(c,LGLYPH[n.lane],LANES[n.lane],ny,15,"#fff");
          c.globalAlpha=1;
        }
        if(judge) Draw.txt(c,judge.text,CX,330,26,judge.col,{out:"#fff",ow:5});
        if(combo>=4) Draw.txt(c,combo+" combo!",CX,300,16,C.bubble);
        if(tm<startT+2) Draw.txt(c,"hit the arrows on the ring! (missing is fine)",CX,452,17,C.bubble,{out:C.night,ow:5});
      }
      else if(beat==="CAKE"){
        crowd(c,0.8,true);
        c.fillStyle="rgba(10,12,24,"+(0.55+dimT*0.4)+")"; c.fillRect(0,0,VW,VH);
        // cart + cake (pushed in by Riley)
        const cx2=cart.x;
        const walking=cx2>CX;
        Chars.riley(c,cx2+158,432+(walking?Math.abs(Math.sin(Game.time*8))*3:0),1,{});
        c.fillStyle="#6a5a7c"; Draw.rr(c,cx2-130,400,260,16,6); c.fill();
        c.fillStyle="#56486a";
        c.beginPath(); c.arc(cx2-90,428,14,0,TAU); c.fill();
        c.beginPath(); c.arc(cx2+90,428,14,0,TAU); c.fill();
        c.fillStyle=C.bubble; Draw.rr(c,cx2-110,346,220,56,12); c.fill();
        c.fillStyle=C.pink;   Draw.rr(c,cx2-86,302,172,48,12); c.fill();
        c.fillStyle="#fff";
        for(let i=0;i<7;i++){ c.beginPath(); c.arc(cx2-86+14+i*24,302,9,0,Math.PI,true); c.fill(); }
        Draw.txt(c,"2 5",cx2,330,30,"#fff",{out:C.pink,ow:6});
        // candles
        for(const cd of candles){
          const lx2=cd.x-CX+cx2;
          c.fillStyle="#FFF8FC"; c.fillRect(lx2-2.4,cd.y-12,4.8,14);
          if(!cd.out){
            const fl=Math.sin(cd.fl)*1.6;
            const fg=c.createRadialGradient(lx2,cd.y-18,1,lx2,cd.y-18,12);
            fg.addColorStop(0,"rgba(255,214,107,0.65)"); fg.addColorStop(1,"rgba(255,214,107,0)");
            c.fillStyle=fg; c.beginPath(); c.arc(lx2,cd.y-18,12,0,TAU); c.fill();
            c.fillStyle="#ffb13d";
            c.beginPath(); c.ellipse(lx2+fl*0.4,cd.y-18,2.6,4.6+fl*0.4,fl*0.08,0,TAU); c.fill();
          }
        }
        if(cart.x===CX && !blowing && t>1){
          const pulse=0.65+0.35*Math.sin(Game.time*4);
          Draw.txt(c,"make a wish...",CX,180,26,C.bubble,{out:C.night,ow:6,style:"italic bold"});
          c.globalAlpha=pulse;
          Draw.txt(c,"then press SPACE to blow out the candles",CX,216,16,"#fff");
          c.globalAlpha=1;
        }
      }
      else if(beat==="LETTER"){
        c.fillStyle="rgba(8,10,20,0.92)"; c.fillRect(0,0,VW,VH);
        let y=150;
        Draw.font(c,20);
        for(let p2=0;p2<=Math.min(para,CONFIG.letter.length-1);p2++){
          const full=CONFIG.letter[p2];
          const text=p2<para? full : full.slice(0,Math.floor(chIdx));
          for(const line of wrapText(c,text,20,640)){
            Draw.txt(c,line,CX,y,20,"#FFF3E6",{align:"center"});
            y+=33;
          }
          y+=13;
        }
        if(para>=CONFIG.letter.length){
          c.globalAlpha=sigT;
          Draw.txt(c,"— "+CONFIG.signature,CX,y+10,20,C.bubble,{style:"italic bold"});
          c.globalAlpha=1;
          if(sigT>=1){
            c.globalAlpha=0.6+0.4*Math.sin(Game.time*4);
            Draw.txt(c,"SPACE ♥",CX,VH-60,15,"#9aa6c0");
            c.globalAlpha=1;
          }
        }
      }
      else if(beat==="END"){
        Draw.discoBall(c,CX,120,64,1,ballSpin,{string:40,rows:7});
        crowd(c,6);
        const wob=(i)=>Math.sin(Game.time*3+i)*4;
        Draw.txt(c,"HAPPY 25TH BIRTHDAY,",CX,212+wob(0),40,C.gold,{out:C.pink,ow:9});
        Draw.txt(c,"MARIAH!",CX,266+wob(2),54,C.bubble,{out:C.pink,ow:10});
        // stats card
        c.fillStyle="rgba(255,253,246,0.94)"; Draw.rr(c,CX-235,300,470,116,14); c.fill();
        c.strokeStyle=C.bubble; c.lineWidth=3; Draw.rr(c,CX-235,300,470,116,14); c.stroke();
        const S=G.stats;
        const lines=[
          "shards: 25/25 ✦ litter cleaned: "+S.litter+" ✦ style: "+Math.round(G.style),
          "lakes loved: 1 ✦ dogs booped: 2 ✦ sisters with one s: 1",
          "trails fallen in love on: 1 ✦ keepsakes: "+G.keepsakeCount()+"/4"
        ];
        lines.forEach((ln,i)=> Draw.txt(c,ln,CX,326+i*28,14.5,C.ink));
        Draw.txt(c,"(X: play it all again someday)",CX,438,12,"#9aa6c0");
      }
      if(flashT>0){
        c.fillStyle="rgba(255,255,255,"+flashT+")"; c.fillRect(0,0,VW,VH);
      }
      Draw.vignette(c);
    }
  };

  // small safe timeout that respects scene lifetime (no-op if scene changed)
  function setTimeoutSafe(fn,sec){
    const at=Game.time+sec;
    const h=setInterval(()=>{
      if(Game.time>=at){ clearInterval(h); if(Scenes.name==="FINALE") fn(); }
    },60);
  }
})());

// ========================= S17 LOOP & BOOT =============================
const Game = {
  time:0, muted:false, paused:false, rm:false,
  hudGlow:0, shakeT:0, shakeAmp:0,
  toasts:[], keyOnce:{}, typed:"", zoomies:null, sneezeT:0,
  stampede:[], stampedeToast:false,
  toast(text,col){ this.toasts.push({text,col:col||C.pink,t:0}); if(this.toasts.length>4) this.toasts.shift(); },
  shake(amp,dur){ if(!this.rm){ this.shakeAmp=Math.max(this.shakeAmp,amp); this.shakeT=Math.max(this.shakeT,dur);} }
};

(()=>{
  const canvas = document.getElementById("game");
  const c = canvas.getContext("2d");
  let view = {scale:1, ox:0, oy:0, dpr:1};

  function resize(){
    const w=window.innerWidth, h=window.innerHeight;
    view.dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.round(w*view.dpr); canvas.height=Math.round(h*view.dpr);
    canvas.style.width=w+"px"; canvas.style.height=h+"px";
    view.scale = Math.min(w/VW, h/VH);
    view.ox = (w - VW*view.scale)/2;
    view.oy = (h - VH*view.scale)/2;
  }
  window.addEventListener("resize", resize);
  resize();

  // reduced motion
  try{
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    Game.rm = mq.matches;
    if(mq.addEventListener) mq.addEventListener("change", e=>{ Game.rm = e.matches; });
  }catch(e){}

  // ---- global keyboard --------------------------------------------------
  const GAMEKEYS = ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"];
  window.addEventListener("keydown", e=>{
    Audio.unlock();
    if(e.repeat){ if(GAMEKEYS.includes(e.code)) e.preventDefault(); return; }
    Game.keyOnce[e.code]=true;
    // typed easter-egg buffer
    if(/^[a-zA-Z]$/.test(e.key)){
      Game.typed = (Game.typed + e.key.toUpperCase()).slice(-8);
      if(Game.typed.endsWith("LUNA")) eggLuna();
      else if(Game.typed.endsWith("SHASTA")) eggShasta();
    }
    const sc = Scenes.cur;
    if(e.code==="KeyM"){
      Game.muted=!Game.muted; Audio.setMuted(Game.muted);
      Game.toast(Game.muted?"muted 🔇":"sound on ♪", C.lav); G.save();
    } else if(e.code==="KeyP" || e.code==="Escape"){
      e.preventDefault();
      if(sc && sc.pausable!==false){
        Game.paused=!Game.paused; Audio.setPaused(Game.paused);
      }
    } else if(e.code==="KeyR"){
      if(sc && sc.pausable!==false && !Scenes.transitioning){
        if(Game.paused){ Game.paused=false; Audio.setPaused(false); } // R works from the pause screen too
        Scenes.restart(); Game.toast("take two!",C.mint);
      }
    } else if(e.code==="Digit9"){
      if(sc && sc.skip && !Scenes.transitioning){
        if(Game.paused){ Game.paused=false; Audio.setPaused(false); }
        if(sc.skip()!==false) Game.toast("psst... skipped ➜",C.lav);
      }
    } else if(e.code==="KeyU"){
      eggSneeze();
    } else if(e.code==="KeyE"){
      G.edmOn=!G.edmOn; Audio.setEdmMode(G.edmOn);
      Game.toast(G.edmOn?"EDM MODE 🔊":"back to the regularly scheduled vibes", C.lav);
      G.save();
    } else if(e.code==="KeyG"){
      if(!Game.paused) eggStampede();
    }
    if(Input.down(e.code)) e.preventDefault();
    if(e.code==="Space") e.preventDefault();
  });
  window.addEventListener("keyup", e=>{ Input.up(e.code); });
  window.addEventListener("blur", ()=>{ Input.clearAll(); });
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){ Input.clearAll(); Audio.setPaused(true); } // rAF freezes; stop the music clumping
    else Audio.setPaused(Game.paused);
  });

  // ---- easter eggs --------------------------------------------------------
  function eggLuna(){
    Audio.sfx.yip(1.1);
    for(let i=0;i<26;i++)
      setTimeout(()=>Particles.paw(Math.random()*VW, -20), i*55);
    Game.toast("LUNA!! 🐾", C.bubble);
  }
  function eggShasta(){
    Audio.sfx.yip(0.8);
    Game.zoomies={t:0};
    Game.toast("SHASTA ZOOMIES!!", C.gold);
  }
  function eggSneeze(){
    Game.sneezeT=1;
    Audio.sfx.chime();
    const a = (Scenes.cur && Scenes.cur.sneezeAnchor) ? Scenes.cur.sneezeAnchor() : {x:VW/2,y:VH/2};
    Particles.burst(a.x,a.y,C.gold,18,200);
    Particles.burst(a.x,a.y,C.bubble,10,150);
    Game.toast("Glitter: ACHOO! ✨", C.lav);
  }
  function eggStampede(){
    const n = Game.rm?1:3;
    for(let i=0;i<n;i++){
      if(Game.stampede.length>=14) Game.stampede.shift();
      const dir=Math.random()<0.5?1:-1;
      Game.stampede.push({
        x: dir>0? -60-Math.random()*140 : VW+60+Math.random()*140,
        y: 300+Math.random()*210,
        dir, speed:220+Math.random()*200, scale:0.7+Math.random()*0.7,
        phase:Math.random()*TAU,
        mode:Math.random()<0.45?"dance":"gallop",
        danceX:80+Math.random()*(VW-160), arrived:false, danceT:0
      });
    }
    for(let i=0;i<(Game.rm?1:3);i++)
      Particles.burst(Math.random()*VW, Math.random()*VH*0.8,
        [C.gold,C.bubble,C.lav][(Math.random()*3)|0], 14, 230);
    Particles.confetti(Math.random()*VW, 60, 10);
    Audio.sfx.chime(); if(Math.random()<0.4) Audio.sfx.pop();
    if(!Game.stampedeToast){ Game.stampedeToast=true; Game.toast("GLITTER STAMPEDE!! (keep pressing G)",C.pink); }
  }

  // ---- fixed-timestep loop ------------------------------------------------
  const STEP=1/60;
  let last=performance.now(), acc=0;

  function frame(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.1) dt=0.1;
    acc+=dt;
    while(acc>=STEP){
      if(!Game.paused){
        Game.time+=STEP;
        Scenes.update(STEP);
        Particles.update(STEP);
        if(Game.zoomies){
          Game.zoomies.t+=STEP;
          if(Game.zoomies.t>3.6) Game.zoomies=null;
        }
        if(Game.stampede.length){
          for(const u of Game.stampede){
            if(u.mode==="dance"){
              if(!u.arrived){
                u.x+=u.dir*u.speed*STEP;
                if((u.dir>0 && u.x>=u.danceX)||(u.dir<0 && u.x<=u.danceX)) u.arrived=true;
              } else {
                u.danceT+=STEP;
                if(u.danceT>3.5){ u.mode="gallop"; }
              }
            } else u.x+=u.dir*u.speed*STEP;
          }
          Game.stampede=Game.stampede.filter(u=>u.x>-180&&u.x<VW+180);
        }
        Game.hudGlow=Math.max(0,Game.hudGlow-STEP*1.6);
        Game.sneezeT=Math.max(0,Game.sneezeT-STEP*2);
        if(Game.shakeT>0){ Game.shakeT-=STEP; if(Game.shakeT<=0) Game.shakeAmp=0; }
        for(const tb of Game.toasts) tb.t+=STEP;
        Game.toasts=Game.toasts.filter(tb=>tb.t<1.8);
      }
      Game.keyOnce={};
      Input.endFrame();
      acc-=STEP;
    }
    render();
    requestAnimationFrame(frame);
  }

  function render(){
    const {scale,ox,oy,dpr}=view;
    c.setTransform(dpr,0,0,dpr,0,0);
    c.fillStyle=C.night;
    c.fillRect(0,0,canvas.width/dpr,canvas.height/dpr);
    c.setTransform(scale*dpr,0,0,scale*dpr,ox*dpr,oy*dpr);
    c.save();
    c.beginPath(); c.rect(0,0,VW,VH); c.clip();
    if(Game.shakeT>0 && !Game.rm){
      c.translate((Math.random()*2-1)*Game.shakeAmp,(Math.random()*2-1)*Game.shakeAmp);
    }
    // EDM beat pump squeezes the whole scene on every kick
    const edmPh = G.edmOn ? Audio.edmPhase() : -1;
    c.save();
    if(edmPh>=0 && !Game.rm){
      const k=1+0.012*(1-edmPh);
      c.translate(VW/2,VH/2); c.scale(k,k); c.translate(-VW/2,-VH/2);
    }
    Scenes.render(c);
    Particles.render(c);
    c.restore();
    // EDM-mode: the club takes over every scene
    if(G.edmOn){
      c.fillStyle="rgba(10,8,30,0.32)"; c.fillRect(0,0,VW,VH);
      const mg=c.createRadialGradient(40,VH-20,30,40,VH-20,640);
      mg.addColorStop(0,"rgba(255,79,163,0.16)"); mg.addColorStop(1,"rgba(255,79,163,0)");
      c.fillStyle=mg; c.fillRect(0,0,VW,VH);
      const cg2=c.createRadialGradient(VW-40,30,30,VW-40,30,640);
      cg2.addColorStop(0,"rgba(122,215,242,0.14)"); cg2.addColorStop(1,"rgba(122,215,242,0)");
      c.fillStyle=cg2; c.fillRect(0,0,VW,VH);
      c.save();
      c.globalAlpha = Game.rm ? 0.07 : 0.07+0.07*(edmPh>=0?(1-edmPh):0.5);
      for(let i=0;i<4;i++){
        const a = Game.rm ? i*0.6-0.9 : Math.sin(Game.time*(0.8+i*0.17)+i*1.7)*1.1;
        c.save(); c.translate(VW/2,-20); c.rotate(a);
        c.fillStyle=[C.pink,"#7AD7F2",C.lav,C.gold][i];
        c.fillRect(-26,0,52,640);
        c.restore();
      }
      c.restore();
      if(edmPh>=0 && edmPh<0.15 && !Game.rm){
        c.fillStyle="rgba(201,167,245,"+(0.10*(1-edmPh/0.15)).toFixed(3)+")";
        c.fillRect(0,0,VW,VH);
      }
    }
    // zoomies overlay
    if(Game.zoomies){
      const z=Game.zoomies.t;
      const passN=Math.floor(z/1.2), k=(z%1.2)/1.2;
      const dir = passN%2===0 ? 1 : -1;
      const zx = dir>0 ? -60+k*(VW+120) : VW+60-k*(VW+120);
      const zy = VH-50-passN*36;
      Chars.shasta(c,zx,zy,1.25,{t:Game.time,run:true,flip:dir<0});
      for(let i=1;i<4;i++){
        c.globalAlpha=0.18/i;
        Chars.shasta(c,zx-dir*i*26,zy,1.25,{t:Game.time,run:true,flip:dir<0});
      }
      c.globalAlpha=1;
    }
    // glitter stampede!!
    if(Game.stampede.length){
      for(const u of Game.stampede){
        const dancing = u.mode==="dance" && u.arrived;
        const bounce = dancing ? Math.abs(Math.sin((Game.time+u.phase)*6))*14 : 0;
        Chars.glitter(c,u.x,u.y-bounce,u.scale,
          {t:Game.time+u.phase, trot:!dancing, sparkle:!Game.rm, flip:u.dir<0});
      }
    }
    // HUD + toasts
    const sc=Scenes.cur;
    if(sc && sc.showHUD) drawHUD(c);
    let ty=84;
    for(const tb of Game.toasts){
      const a = tb.t<0.15? tb.t/0.15 : tb.t>1.4? 1-(tb.t-1.4)/0.4 : 1;
      c.globalAlpha=clamp(a,0,1);
      Draw.txt(c,tb.text,VW/2,ty - tb.t*10,21,tb.col,{out:"#fff",ow:6});
      ty+=30;
    }
    c.globalAlpha=1;
    // pause + instructions card
    if(Game.paused){
      c.fillStyle="rgba(30,42,68,0.74)"; c.fillRect(0,0,VW,VH);
      Draw.discoBall(c,VW/2,84,36,G.shardCount()/25,Game.time*0.1);
      Draw.txt(c,"paused",VW/2,152,32,C.bubble,{out:C.pink,ow:8});
      c.fillStyle="rgba(255,253,246,0.95)"; Draw.rr(c,VW/2-250,182,500,276,16); c.fill();
      c.strokeStyle=C.bubble; c.lineWidth=3; Draw.rr(c,VW/2-250,182,500,276,16); c.stroke();
      Draw.txt(c,"how to play",VW/2,210,18,C.pink,{out:"#fff",ow:4});
      const rows=[
        ["←↑↓→ / WASD","move · steer · carve"],
        ["SPACE","jump · boost · talk · dance"],
        ["9","skip ahead — works on anything"],
        ["E","EDM mode: new beat, new lights"],
        ["G","glitter stampede (spam it!!)"],
        ["M  ·  R","mute · restart this bit"],
        ["P or ESC","pause (you found it)"]
      ];
      let ry=242;
      for(const [k2,d2] of rows){
        Draw.txt(c,k2,VW/2-222,ry,15,C.pink,{align:"left"});
        Draw.txt(c,d2,VW/2-62,ry,15,"#4a3a50",{align:"left"});
        ry+=30;
      }
      Draw.txt(c,"P or ESC to keep going ♥",VW/2,482,16,C.bubble,{out:C.pink,ow:4});
    }
    c.restore();
  }

  // ---- debug snapshot (read-only, used by QA) -----------------------------
  Object.defineProperty(window,"__dq",{
    get(){
      return {
        scene:Scenes.name, progress:G.progress, shards:G.shardCount(),
        eco:G.eco, style:G.style, keepsakes:G.keepsakeCount(),
        edmUnlocked:G.edmUnlocked, edmOn:G.edmOn,
        paused:Game.paused, audio:Audio.state()
      };
    }
  });

  // ---- boot ----------------------------------------------------------------
  G.load();
  Scenes.go("TITLE");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
